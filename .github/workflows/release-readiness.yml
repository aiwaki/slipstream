name: release-readiness

on:
  workflow_dispatch:
    inputs:
      release_candidate_run_id:
        description: "Optional successful ci.yml main run ID for this exact SHA."
        required: false

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: account-backed-geph
  cancel-in-progress: false

jobs:
  exact-candidate-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 75
    environment: geph-qualification
    env:
      SLIPSTREAM_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: spike/requirements.txt

      - name: Install locked qualification dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/requirements.txt

      - name: Resolve exact successful main candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_INPUT: ${{ github.event.inputs.release_candidate_run_id }}
        run: |
          set -euo pipefail
          run_id="$CANDIDATE_INPUT"
          if [ -z "$run_id" ]; then
            run_id="$(gh api --paginate \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | select(.conclusion == \"success\") | .id" \
              | sed -n '1p')"
          fi
          [ -n "$run_id" ] || {
            echo "no successful exact-main release candidate exists for $GITHUB_SHA"
            exit 1
          }
          metadata="$(gh api \
            "repos/${{ github.repository }}/actions/runs/$run_id")"
          python3 -c '
          import json
          import sys
          run = json.load(sys.stdin)
          expected_sha, repository = sys.argv[1:]
          expected = {
              "head_sha": expected_sha,
              "head_branch": "main",
              "event": "push",
              "conclusion": "success",
              "path": ".github/workflows/ci.yml",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"candidate run has invalid {key}: {run.get(key)!r}")
          if (run.get("head_repository") or {}).get("full_name") != repository:
              raise SystemExit("candidate run belongs to a different repository")
          if not isinstance(run.get("run_attempt"), int) or run["run_attempt"] <= 0:
              raise SystemExit("candidate run attempt is invalid")
          ' "$GITHUB_SHA" "${{ github.repository }}" <<< "$metadata"
          run_attempt="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["run_attempt"])' \
            <<< "$metadata")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify and unpack exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signer="${{ github.repository }}/.github/workflows/ci.yml"
          for artifact in dist-candidate/*; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "$signer" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done
          mkdir -p "$RUNNER_TEMP/candidate-app"
          ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
            "$RUNNER_TEMP/candidate-app"
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          source_archive_sha256="$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          python3 scripts/release_candidate.py verify \
            --candidate-dir dist-candidate \
            --repository "${{ github.repository }}" \
            --version "$(tr -d '[:space:]' < VERSION)" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --source-archive-sha256 "$source_archive_sha256" \
            --source-date-epoch "$(git show -s --format=%ct "$GITHUB_SHA")" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --expected-workflow-run-id "${{ steps.candidate.outputs.run_id }}" \
            --expected-workflow-run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app"
          app="$RUNNER_TEMP/candidate-app/Slipstream.app"
          test "$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$app/Contents/Info.plist"
          )" = slipstream
          /usr/bin/lipo "$app/Contents/MacOS/slipstream" -verify_arch arm64
          helper="$app/Contents/MacOS/slipstream-browser-probe"
          watchdog="$app/Contents/MacOS/slipstream-update-watchdog"
          for binary in "$helper" "$watchdog"; do
            test -x "$binary"
            /usr/bin/lipo "$binary" -verify_arch arm64
            /usr/bin/codesign --verify --strict "$binary"
            if /usr/bin/otool -L "$binary" | /usr/bin/grep -E \
              'AppKit\.framework|Cocoa\.framework|WebKit\.framework'; then
              echo "non-GUI helper links a GUI framework: $binary" >&2
              exit 1
            fi
          done
          /usr/bin/lipo "$app/Contents/MacOS/geph5-client" -verify_arch arm64
          /usr/bin/codesign --verify --deep --strict "$app"

      - name: Qualify exact-candidate dual-stack PF and QUIC mechanics
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
          SLIPSTREAM_RELEASE_READINESS: "1"
        run: |
          set -euo pipefail
          mkdir -p dist-readiness
          sudo -E "$(command -v python3)" \
            scripts/packaged_transport_mechanics_smoke.py \
            --candidate-dir dist-candidate \
            --app-bundle "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --source-commit "$GITHUB_SHA" \
            --candidate-run-id "${{ steps.candidate.outputs.run_id }}" \
            --candidate-run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --readiness-run-id "$GITHUB_RUN_ID" \
            --readiness-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output dist-readiness/transport-mechanics.json

      - name: Install qualified Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77
          install-chromedriver: false

      - name: Establish a daemon-free qualification boundary
        run: |
          set -euo pipefail
          test ! -e /Library/LaunchDaemons/dev.slipstream.tproxy.plist
          sudo launchctl disable system/dev.slipstream.tproxy
          if sudo launchctl print system/dev.slipstream.tproxy >/dev/null 2>&1; then
            echo "Slipstream root daemon is still loaded" >&2
            exit 1
          fi
          test -z "$(sudo pfctl -a com.apple/slipstream -sn 2>/dev/null)"
          test -z "$(sudo pfctl -a com.apple/slipstream -sr 2>/dev/null)"

      - name: Run account-backed Safari and Chrome live-site gate
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
          SLIPSTREAM_RELEASE_READINESS: "1"
          SLIPSTREAM_GEPH_ACCOUNT_SECRET: ${{ secrets.SLIPSTREAM_GEPH_ACCOUNT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p dist-readiness
          # Preserve a bounded nonzero marker even when account-backed Geph
          # fails before SafariDriver or the browser matrix can start.
          printf '%s\n' 125 > dist-readiness/live-sites.exit
          : "${SLIPSTREAM_GEPH_ACCOUNT_SECRET:?missing protected Geph account}"
          ready="$RUNNER_TEMP/readiness-geph.ready"
          release="$RUNNER_TEMP/readiness-geph.release"
          geph_log="$RUNNER_TEMP/readiness-geph.log"
          driver_log="$RUNNER_TEMP/readiness-safaridriver.log"
          rm -f "$ready" "$release" "$geph_log" "$driver_log"
          python3 scripts/geph_owned_lifecycle_smoke.py \
            --app-bundle "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --ready-file "$ready" \
            --release-file "$release" >"$geph_log" 2>&1 &
          geph_pid=$!
          driver_pid=""
          cleanup() {
            status=$?
            if [ -n "$driver_pid" ] && kill -0 "$driver_pid" 2>/dev/null; then
              kill -TERM "$driver_pid" 2>/dev/null || true
              wait "$driver_pid" 2>/dev/null || true
            fi
            if kill -0 "$geph_pid" 2>/dev/null; then
              /usr/bin/install -m 600 /dev/null "$release"
              wait "$geph_pid" 2>/dev/null || true
            fi
            cat "$geph_log" || true
            test "$status" -eq 0 || cat "$driver_log" || true
            rm -f "$ready" "$release" "$geph_log" "$driver_log"
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 720); do
            test -f "$ready" && break
            kill -0 "$geph_pid" 2>/dev/null || {
              wait "$geph_pid" || true
              exit 1
            }
            sleep 0.25
          done
          test -f "$ready"
          env -u SLIPSTREAM_GEPH_ACCOUNT_SECRET sudo -E "$(command -v python3)" \
            scripts/chromium_semantic_packaged_smoke.py \
            --app-bundle "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --chrome-executable "${{ steps.chrome.outputs.chrome-path }}"
          sudo /usr/bin/safaridriver --enable
          driver_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          /usr/bin/safaridriver --diagnose --port "$driver_port" \
            >"$driver_log" 2>&1 &
          driver_pid=$!
          driver_url="http://127.0.0.1:$driver_port"
          driver_status=""
          driver_status_received=0
          driver_ready=0
          for _ in $(seq 1 100); do
            kill -0 "$driver_pid" 2>/dev/null || exit 1
            if driver_status="$(/usr/bin/curl --silent --show-error --noproxy '*' \
              --max-time 2 "$driver_url/status" 2>/dev/null)"; then
              driver_status_received=1
              if printf '%s' "$driver_status" | python3 -c \
                'import json, sys; value=json.load(sys.stdin).get("value", {}); raise SystemExit(value.get("ready") is not True)'; then
                driver_ready=1
                break
              fi
            fi
            sleep 0.2
          done
          if [ "$driver_ready" -ne 1 ]; then
            if [ "$driver_status_received" -eq 1 ]; then
              echo "safaridriver did not report ready before timeout" >&2
            else
              echo "safaridriver did not return a status response before timeout" >&2
            fi
            exit 1
          fi
          set +e
          env -u SLIPSTREAM_GEPH_ACCOUNT_SECRET sudo -E "$(command -v python3)" \
            scripts/live_site_release_smoke.py \
            --app-bundle "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --chrome-executable "${{ steps.chrome.outputs.chrome-path }}" \
            --safaridriver-url "$driver_url" \
            --output "$RUNNER_TEMP/live-sites.json"
          live_status=$?
          set -e
          /usr/bin/install -m 600 "$RUNNER_TEMP/live-sites.json" \
            dist-readiness/live-sites.json
          sudo /bin/rm -f "$RUNNER_TEMP/live-sites.json"
          printf '%s\n' "$live_status" > dist-readiness/live-sites.exit
          kill -TERM "$driver_pid" 2>/dev/null || true
          wait "$driver_pid" 2>/dev/null || true
          driver_pid=""
          /usr/bin/install -m 600 /dev/null "$release"
          wait "$geph_pid"
          cat "$geph_log"
          trap - EXIT
          rm -f "$ready" "$release" "$geph_log" "$driver_log"

      - name: Preserve bounded live-site diagnostics for this attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Slipstream-live-site-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist-readiness/live-sites.json
            dist-readiness/live-sites.exit
          if-no-files-found: error
          retention-days: 7

      - name: Verify the account-backed gate cleaned product-owned state
        if: always()
        run: |
          set -euo pipefail
          test ! -e /Library/LaunchDaemons/dev.slipstream.tproxy.plist
          if sudo launchctl print system/dev.slipstream.tproxy >/dev/null 2>&1; then
            echo "Slipstream root daemon survived the account-backed gate" >&2
            exit 1
          fi
          test -z "$(sudo pfctl -a com.apple/slipstream -sn 2>/dev/null)"
          test -z "$(sudo pfctl -a com.apple/slipstream -sr 2>/dev/null)"
          test ! -e /var/run/slipstream-pf.token
          test ! -e /var/run/slipstream-pf-lo0-skip.json
          test ! -e /var/run/slipstream.status
          test ! -e /var/run/slipstream-autogeph.json
          test ! -e /var/run/slipstream-semantic.sock
          test -z "$(/usr/sbin/lsof -nP -t -iTCP@127.0.0.1:9954 -sTCP:LISTEN || true)"
          if launchctl print "gui/$(id -u)/dev.slipstream.geph" >/dev/null 2>&1; then
            echo "Slipstream owned-Geph LaunchAgent survived the account-backed gate" >&2
            exit 1
          fi
          test ! -e "$HOME/Library/LaunchAgents/dev.slipstream.geph.plist"
          test ! -e "$HOME/Library/Application Support/dev.slipstream.tray"
          test ! -e "$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/dev.slipstream.semantic.json"
          if security find-generic-password \
            -s dev.slipstream.geph -a account-secret >/dev/null 2>&1; then
            echo "Slipstream owned-Geph Keychain item survived the account-backed gate" >&2
            exit 1
          fi

      - name: Require passed live-site matrix before the long soak
        run: |
          set -euo pipefail
          live_status="$(tr -d '[:space:]' < dist-readiness/live-sites.exit)"
          PYTHONPATH=scripts python3 - "$live_status" <<'PY'
          import json
          from pathlib import Path
          import sys

          import release_readiness

          report = json.loads(
              Path("dist-readiness/live-sites.json").read_text(encoding="utf-8")
          )
          result = release_readiness.validate_live_report(report, int(sys.argv[1]))
          if result != "passed":
              raise SystemExit("live-site matrix did not pass; skipping the long soak")
          PY

      - name: Run measured 30-minute background invisibility soak
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
          SLIPSTREAM_RELEASE_READINESS: "1"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          set +e
          python3 scripts/packaged_invisibility_soak.py \
            --app-bundle "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --duration-seconds 1800 \
            --output dist-readiness/invisibility-soak.json
          soak_status=$?
          set -e
          printf '%s\n' "$soak_status" > dist-readiness/invisibility-soak.exit

      - name: Verify the soak left no product-owned system path
        if: always()
        run: |
          set -euo pipefail
          test ! -e /Library/LaunchDaemons/dev.slipstream.tproxy.plist
          if sudo launchctl print system/dev.slipstream.tproxy >/dev/null 2>&1; then
            echo "Slipstream root daemon survived the invisibility soak" >&2
            exit 1
          fi
          test -z "$(sudo pfctl -a com.apple/slipstream -sn 2>/dev/null)"
          test -z "$(sudo pfctl -a com.apple/slipstream -sr 2>/dev/null)"
          test ! -e /var/run/slipstream-pf.token
          test ! -e /var/run/slipstream-pf-lo0-skip.json
          test ! -e /var/run/slipstream.status
          test ! -e /var/run/slipstream-autogeph.json
          test ! -e /var/run/slipstream-semantic.sock

      - name: Bind qualification and measured readiness to one workflow attempt
        run: |
          set -euo pipefail
          live_status="$(tr -d '[:space:]' < dist-readiness/live-sites.exit)"
          soak_status="$(tr -d '[:space:]' < dist-readiness/invisibility-soak.exit)"
          mkdir -p dist-qualified
          python3 scripts/release_candidate.py create-proof \
            --candidate-dir dist-candidate \
            --output dist-qualified/release-qualification.json \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --qualification-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --qualification-workflow .github/workflows/release-readiness.yml \
            --expected-candidate-run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app"
          python3 scripts/release_readiness.py create \
            --candidate-dir dist-candidate \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --live-report dist-readiness/live-sites.json \
            --live-exit-status "$live_status" \
            --soak-report dist-readiness/invisibility-soak.json \
            --soak-exit-status "$soak_status" \
            --transport-report dist-readiness/transport-mechanics.json \
            --candidate-run-id "${{ steps.candidate.outputs.run_id }}" \
            --candidate-run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --readiness-run-id "$GITHUB_RUN_ID" \
            --readiness-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output dist-readiness/release-readiness.json
          rm -f dist-readiness/*.exit

      - name: Attest exact qualification proof
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist-qualified/release-qualification.json

      - name: Attest exact release-readiness evidence
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist-readiness/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Slipstream-owned-geph-qualified-${{ github.sha }}
          path: dist-qualified/release-qualification.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Slipstream-release-ready-${{ github.sha }}
          path: dist-readiness/
          if-no-files-found: error
          retention-days: 7

      - name: Require passed live sites and measured invisibility soak
        run: |
          python3 scripts/release_readiness.py verify \
            --candidate-dir dist-candidate \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --live-report dist-readiness/live-sites.json \
            --soak-report dist-readiness/invisibility-soak.json \
            --transport-report dist-readiness/transport-mechanics.json \
            --candidate-run-id "${{ steps.candidate.outputs.run_id }}" \
            --candidate-run-attempt "${{ steps.candidate.outputs.run_attempt }}" \
            --readiness-run-id "$GITHUB_RUN_ID" \
            --readiness-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --proof dist-readiness/release-readiness.json \
            --require-passed
