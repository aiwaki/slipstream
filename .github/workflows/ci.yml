name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.scope.outputs.product }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          product=false
          windows=false
          changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            changed=true
            case "$path" in
              README.md|README.en.md|docs/*|*.md) ;;
              *) product=true ;;
            esac
            case "$path" in
              .github/workflows/ci.yml|.github/workflows/windows-packet-adapter-qualification.yml|contracts/*|crates/slipstream-core/*|crates/slipstream-userspace-stack-evaluation/*|crates/slipstream-userspace-stack-effect-evaluation/*|crates/slipstream-windows-adapter/*|vendor/wintun/*)
                windows=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")
          if [ "$changed" = false ]; then
            echo "empty change set cannot bypass product gates"
            product=true
            windows=true
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  product-checks:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          components: clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: "pip"
          cache-dependency-path: "spike/requirements.txt"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/src-tauri/target
            crates/slipstream-core/target
            crates/slipstream-userspace-stack-evaluation/target
            crates/slipstream-userspace-stack-effect-evaluation/target
            crates/slipstream-windows-adapter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app-tauri/src-tauri/Cargo.lock', 'crates/slipstream-core/Cargo.lock', 'crates/slipstream-userspace-stack-evaluation/Cargo.lock', 'crates/slipstream-userspace-stack-effect-evaluation/Cargo.lock', 'crates/slipstream-windows-adapter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Python test deps
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/requirements.txt

      - name: Check version metadata
        run: python3 scripts/sync_version.py --check

      - name: Test release metadata scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Browser companion contract
        run: |
          node --check browser-companion/chromium/content.js
          node --check browser-companion/chromium/service-worker.js
          node --check browser-companion/safari/service-worker.js
          node --test browser-companion/chromium/tests/*.test.mjs
          python3 scripts/package_chromium_companion.py \
            --output "${RUNNER_TEMP}/slipstream-chromium-store"

      - name: Appcast CLI smoke
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          printf 'test-signature\n' > /tmp/slipstream-test.sig
          python3 scripts/make_appcast.py \
            --version "$version" \
            --tag "v$version" \
            --repository "${{ github.repository }}" \
            --signature-file /tmp/slipstream-test.sig \
            --output /tmp/slipstream-latest.json \
            --pub-date 2026-07-08T12:00:00Z
          python3 -m json.tool /tmp/slipstream-latest.json >/dev/null

      - name: Route policy bundle CLI smoke
        run: |
          set -euo pipefail
          python3 scripts/make_route_policy_bundle.py \
            --generate-keypair \
            --key-id ci-test \
            --private-key-output /tmp/slipstream-route-policy.key \
            --public-keys-output /tmp/slipstream-route-policy-keys.json
          python3 scripts/make_route_policy_bundle.py \
            --bundled-manifest \
            --key-id ci-test \
            --private-key-file /tmp/slipstream-route-policy.key \
            --output /tmp/slipstream-route-policy.json \
            --public-keys-output /tmp/slipstream-route-policy-derived-keys.json
          python3 -m json.tool /tmp/slipstream-route-policy.json >/dev/null
          python3 scripts/make_route_policy_bundle.py \
            --verify \
            --bundle /tmp/slipstream-route-policy.json \
            --public-keys /tmp/slipstream-route-policy-keys.json
          python3 scripts/make_route_policy_bundle.py \
            --channel-index \
            --bundle /tmp/slipstream-route-policy.json \
            --bundle-url https://policy.example.org/channel/route-policy.json \
            --output /tmp/slipstream-route-policy-latest.json
          python3 -m json.tool /tmp/slipstream-route-policy-latest.json >/dev/null

      - name: Python compile check
        run: |
          python3 -m py_compile \
            spike/address_attempts.py \
            spike/bootstrap_asset_preflight.py \
            spike/connection_probe.py \
            spike/connection_race.py \
            spike/connection_race_io.py \
            spike/http_response_completion.py \
            spike/install_guard.py \
            spike/pending_navigation_probe_runtime.py \
            spike/route_circuit.py \
            spike/route_circuit_registry.py \
            spike/route_policy_activation.py \
            spike/route_policy_activation_adapter.py \
            spike/routing_policy.py \
            spike/routing_recovery.py \
            spike/semantic_route_signal.py \
            spike/semantic_route_signal_runtime.py \
            spike/tproxy.py \
            spike/xbox_dns.py \
            spike/test_recovery.py \
            spike/test_route_policy_activation.py \
            spike/test_route_policy_activation_adapter.py \
            spike/test_connection_race_contract.py \
            spike/test_connection_race_io.py \
            spike/test_connection_probe.py \
            spike/test_http_response_completion.py \
            spike/test_install_guard.py \
            spike/test_pending_navigation_probe_runtime.py \
            spike/test_routing_contract_vectors.py \
            spike/test_semantic_route_signal.py \
            spike/test_semantic_route_signal_runtime.py \
            spike/test_traffic_contracts.py \
            spike/test_baseline_startup.py \
            spike/test_bootstrap_asset_preflight.py \
            spike/test_tproxy_doh.py \
            spike/test_xbox_dns.py \
            scripts/pf_anchor_smoke.py \
            scripts/pf_installed_lifecycle_smoke.py \
            scripts/composed_pending_navigation_smoke.py \
            scripts/sync_version.py \
            scripts/make_appcast.py \
            scripts/dependency_audit.py \
            scripts/make_release_manifest.py \
            scripts/make_release_sbom.py \
            scripts/make_route_policy_bundle.py \
            scripts/package_chromium_companion.py \
            scripts/pending_navigation_browser_probe_smoke.py \
            scripts/packaged_transport_mechanics_smoke.py \
            scripts/release_transport_matrix.py \
            scripts/check_project_state.py \
            scripts/verify_release_artifacts.py \
            scripts/test_pf_anchor_smoke.py \
            scripts/test_pf_installed_lifecycle_smoke.py \
            scripts/test_packaged_transport_mechanics_smoke.py \
            scripts/test_release_transport_matrix.py \
            scripts/test_make_appcast.py \
            scripts/test_dependency_audit.py \
            scripts/test_make_release_manifest.py \
            scripts/test_make_release_sbom.py \
            scripts/test_make_route_policy_bundle.py \
            scripts/test_package_chromium_companion.py \
            scripts/test_browser_companion.py \
            scripts/test_slipstream_core.py \
            scripts/test_verify_release_artifacts.py

      - name: Project continuity contract
        run: python3 scripts/check_project_state.py

      - name: Core traffic contracts
        run: python3 -m pytest -q spike/test_traffic_contracts.py

      - name: Daemon unit tests
        run: python3 -m pytest -q spike

      - name: Qualify deterministic exact-host TCP fallback and QUIC v1/v2 observation matrix
        run: |
          python3 -m pytest -q \
            spike/test_tproxy_doh.py::test_quic_v1_v2_observation_and_exact_host_fallback_cover_ipv4_ipv6 \
            spike/test_tproxy_doh.py::test_packaged_transport_mechanics_selftest_covers_fixed_matrix_without_network \
            spike/test_tproxy_doh.py::test_quic_tcp_fallback_is_exactly_active_owned_geo_exit_policy_scoped \
            spike/test_tproxy_doh.py::test_quic_initial_sni_reassembles_publicly_decryptable_crypto_frames \
            spike/test_tproxy_doh.py::test_quic_v2_initial_sni_uses_rfc9369_keys_and_packet_type \
            spike/test_tproxy_doh.py::test_ipv6_quic_v2_fallback_is_exact_host_and_flow_scoped

      - name: Private PF anchor sentinel smoke
        run: sudo -E "$(command -v python3)" scripts/pf_anchor_smoke.py

      - name: Prepare Tauri test resources
        run: |
          mkdir -p app-tauri/src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          chmod +x app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          mkdir -p app-tauri/src-tauri/slipstreamd
          printf '#!/bin/sh\nexit 0\n' > app-tauri/src-tauri/slipstreamd/slipstreamd
          chmod +x app-tauri/src-tauri/slipstreamd/slipstreamd

      - name: Rust tray tests
        working-directory: app-tauri/src-tauri
        run: cargo test

      - name: Rust core tests
        run: cargo test --locked --manifest-path crates/slipstream-core/Cargo.toml

      - name: Rust Windows adapter tests
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml

      - name: Rust userspace stack evaluation tests
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml

      - name: Rust selected-stack and native connector effect tests
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml

      - name: Rust tray lint
        working-directory: app-tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust core lint
        run: cargo clippy --locked --manifest-path crates/slipstream-core/Cargo.toml --all-targets -- -D warnings

      - name: Rust Windows adapter lint
        run: cargo clippy --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Rust userspace stack evaluation lint
        run: cargo clippy --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml --all-targets -- -D warnings

      - name: Rust selected-stack and native connector effect lint
        run: cargo clippy --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml --all-targets -- -D warnings

      - name: Installed daemon lifecycle sentinel smoke
        env:
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: sudo -E "$(command -v python3)" scripts/pf_installed_lifecycle_smoke.py

  chromium-webrequest-contract:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install proven Chrome for Testing extension contract
        id: chrome-for-testing
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          # Reproducible legacy extension contract. The extensionless packaged
          # observer below remains on latest stable Chrome.
          chrome-version: 151.0.7922.77
          install-chromedriver: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Qualify unified headless Chromium observation and budgets
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          sudo -E "$(command -v python3)" \
            scripts/chromium_webrequest_event_smoke.py \
            --chrome-executable "${{ steps.chrome-for-testing.outputs.chrome-path }}"

  windows-adapter-contract:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          components: clippy

      - name: Test Windows contracts, worker host, ownership, lifecycle state, and SCM gates
        env:
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml

      - name: Test the effect-free userspace stack evaluation
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml

      - name: Test selected-stack and native connector effect boundaries
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml

      - name: Qualify exact Windows SCM registration and removal
        env:
          SLIPSTREAM_WINDOWS_SCM_DISPOSABLE_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml service_scm::windows::tests::native_register_and_unregister_are_exact_and_disposable -- --exact --test-threads=1

      - name: Build the production host and disposable Windows fixtures
        run: cargo build --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture --bins

      - name: Qualify the composed Windows service lifecycle and compensation
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_FULL_LIFECYCLE_CI: "1"
        run: |
          $fixture = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-service.exe"
          $env:SLIPSTREAM_WINDOWS_SERVICE_FIXTURE = $fixture.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_native::windows::tests::native_full_lifecycle_and_post_commit_compensation_are_disposable -- --exact --test-threads=1

      - name: Qualify controller-process restart reconciliation
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_CONTROLLER_RESTART_CI: "1"
        run: |
          $service = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-service.exe"
          $controller = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-controller.exe"
          $env:SLIPSTREAM_WINDOWS_SERVICE_FIXTURE = $service.Path
          $env:SLIPSTREAM_WINDOWS_CONTROLLER_FIXTURE = $controller.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_controller::windows::tests::controller_process_restarts_preserve_idempotence_and_recovery_budget -- --exact --test-threads=1

      - name: Qualify the production Windows service host and manager
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_PRODUCTION_HOST_CI: "1"
        run: |
          $serviceHost = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-windows-service.exe"
          $env:SLIPSTREAM_WINDOWS_PRODUCTION_HOST = $serviceHost.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_host::windows::tests::production_host_is_self_managing_idempotent_and_stops_through_scm -- --exact --test-threads=1

      - name: Qualify the bounded native Windows direct connector
        env:
          SLIPSTREAM_WINDOWS_DIRECT_CONNECTOR_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test direct_connector_windows native_direct_connector_loopback_contract_is_bounded_and_owned -- --exact --test-threads=1

      - name: Qualify owned-client direct ingress and bounded relay backpressure
        env:
          SLIPSTREAM_WINDOWS_DIRECT_INGRESS_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test direct_ingress_windows native_direct_ingress_loopback_contract_is_bounded_and_owned -- --exact --test-threads=1

      - name: Qualify the pinned signed Wintun artifacts without loading them
        shell: pwsh
        run: |
          $source = Get-Content -Raw "vendor/wintun/SOURCE.json" | ConvertFrom-Json
          $expectedUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          if ($source.source_url -ne $expectedUrl) {
            throw "Wintun fixture URL is not the reviewed official source"
          }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "slipstream-wintun-$($source.version)"
          $archive = Join-Path $fixtureRoot "wintun-$($source.version).zip"
          $expanded = Join-Path $fixtureRoot "expanded"
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          Invoke-WebRequest -Uri $source.source_url -OutFile $archive

          $archiveFile = Get-Item -LiteralPath $archive
          if ($archiveFile.Length -ne [long]$source.archive_length) {
            throw "Wintun archive length mismatch before extraction"
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $source.archive_sha256) {
            throw "Wintun archive SHA-256 mismatch before extraction"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded

          $env:SLIPSTREAM_WINDOWS_WINTUN_CI = "1"
          $env:SLIPSTREAM_WINTUN_ARCHIVE = $archive
          $env:SLIPSTREAM_WINTUN_LICENSE = Join-Path $expanded $source.license.path
          $env:SLIPSTREAM_WINTUN_AMD64_DLL = Join-Path $expanded $source.architectures.x86_64.path
          $env:SLIPSTREAM_WINTUN_ARM64_DLL = Join-Path $expanded $source.architectures.aarch64.path
          $testName = "packet_adapter::windows::tests::official_amd64_and_arm64_artifacts_are_admitted_without_loading"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --lib $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact Wintun qualification test did not execute"
          }

      - name: Qualify empty WFP dynamic-session rollback without live filters
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_WFP_SESSION_CI: "1"
          CARGO_TERM_COLOR: "never"
        run: |
          $testName = "wfp_session::windows::tests::empty_dynamic_session_transaction_is_disposable_and_filter_free"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --lib $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact WFP qualification test did not execute"
          }

      - name: Lint Windows contracts, ingress, worker host, ownership, lifecycle state, and SCM effects
        run: cargo clippy --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --all-targets --all-features -- -D warnings

  packaged-app-build:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SLIPSTREAM_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: spike/requirements-build.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/src-tauri/target
          key: cargo-packaged-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app-tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-packaged-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-

      - name: Require the production architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64

      - name: Build the frozen daemon
        run: |
          set -euo pipefail
          python3 -m venv spike/.buildvenv
          spike/.buildvenv/bin/python -m pip install \
            --quiet \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/requirements-build.txt
          spike/.buildvenv/bin/python scripts/make_route_policy_bundle.py \
            --generate-keypair \
            --key-id ci-packaged-lifecycle \
            --private-key-output /tmp/slipstream-route-policy.key \
            --public-keys-output spike/route-policy-keys.json
          ( cd spike && .buildvenv/bin/pyinstaller --noconfirm --clean slipstreamd.spec )
          rm -rf app-tauri/src-tauri/slipstreamd
          cp -R spike/dist/slipstreamd app-tauri/src-tauri/slipstreamd
          test -x app-tauri/src-tauri/slipstreamd/slipstreamd
          /usr/bin/lipo app-tauri/src-tauri/slipstreamd/slipstreamd \
            -verify_arch arm64

      - name: Fetch the recorded Geph build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < vendor/geph/VERSION)"
          release_revision="$(python3 -c 'import json; print(json.load(open("vendor/geph/SOURCE.json"))["release_revision"])')"
          tag="geph-vendor-$version-r$release_revision"
          rm -rf /tmp/geph
          mkdir -p app-tauri/src-tauri/binaries
          python3 scripts/download_github_release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "$tag" \
            --output /tmp/geph \
            --pattern geph5-client
          cp /tmp/geph/geph5-client \
            app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          chmod +x app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          /usr/bin/lipo \
            app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin \
            -verify_arch arm64

      - name: Materialize pinned Chromium headless shell
        run: |
          set -euo pipefail
          python3 scripts/materialize_chromium_headless_shell.py \
            --output app-tauri/src-tauri/chromium-headless-shell
          /usr/bin/lipo \
            app-tauri/src-tauri/chromium-headless-shell/chrome-headless-shell \
            -verify_arch arm64

      - name: Build the packaged app
        working-directory: app-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            : "${TAURI_SIGNING_PRIVATE_KEY:?main release-candidate build requires TAURI_SIGNING_PRIVATE_KEY}"
            npm run build
          else
            npm run build:local -- --target "$SLIPSTREAM_TAURI_TARGET"
          fi

      - name: Verify packaged resources
        run: |
          set -euo pipefail
          app="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle/macos/Slipstream.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" \
            = "$(tr -d '[:space:]' < VERSION)"
          /usr/bin/lipo "$app/Contents/MacOS/slipstream" -verify_arch arm64
          /usr/bin/lipo "$app/Contents/Resources/slipstreamd/slipstreamd" \
            -verify_arch arm64
          /usr/bin/lipo "$app/Contents/MacOS/geph5-client" -verify_arch arm64
          test -x "$app/Contents/Resources/chromium-headless-shell/chrome-headless-shell"
          test -f "$app/Contents/Resources/chromium-headless-shell/LICENSE.headless_shell"
          test -f "$app/Contents/Resources/chromium-headless-shell/manifest.json"
          /usr/bin/lipo \
            "$app/Contents/Resources/chromium-headless-shell/chrome-headless-shell" \
            -verify_arch arm64
          /usr/bin/codesign --verify --deep --strict "$app"
          daemon="$app/Contents/Resources/slipstreamd/slipstreamd"
          test "$("$daemon" --classify-host rr1---sn-test.googlevideo.com)" = \
            '{"host": "rr1---sn-test.googlevideo.com", "route_class": "direct_first", "service_group": "youtube_video", "strategy_set": "direct_first"}'
          test "$("$daemon" --classify-host www.youtube.com)" = \
            '{"host": "www.youtube.com", "route_class": "local_bypass", "service_group": "youtube_video", "strategy_set": "fake_only"}'

      - name: Assemble immutable main release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          bundle="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle"
          candidate="dist-candidate"
          mkdir -p "$candidate"
          ditto -c -k --keepParent \
            "$bundle/macos/Slipstream.app" \
            "$candidate/Slipstream-macos-arm64.zip"
          cp "$bundle/macos/Slipstream.app.tar.gz" "$candidate/"
          cp "$bundle/macos/Slipstream.app.tar.gz.sig" "$candidate/"
          dmg_count=0
          for dmg in "$bundle"/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "$candidate/"
            dmg_count=$((dmg_count + 1))
          done
          [ "$dmg_count" -eq 1 ] || {
            echo "expected exactly one release-candidate DMG, found $dmg_count"
            exit 1
          }
          cargo metadata \
            --manifest-path app-tauri/src-tauri/Cargo.toml \
            --locked \
            --filter-platform "$SLIPSTREAM_TAURI_TARGET" \
            --format-version 1 \
            > "$RUNNER_TEMP/slipstream-cargo-metadata.json"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/make_release_sbom.py \
            --version "$version" \
            --tag "release-candidate-$GITHUB_SHA" \
            --repository "${{ github.repository }}" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --cargo-lock app-tauri/src-tauri/Cargo.lock \
            --cargo-metadata "$RUNNER_TEMP/slipstream-cargo-metadata.json" \
            --npm-lock app-tauri/package-lock.json \
            --python-lock spike/requirements-runtime.txt \
            --geph-version-file vendor/geph/VERSION \
            --geph-source-file vendor/geph/SOURCE.json \
            --tg-ws-proxy-version-file vendor/tg-ws-proxy/VERSION \
            --chromium-headless-shell-source-file vendor/chromium-headless-shell/SOURCE.json \
            --output "$candidate/Slipstream.spdx.json"
          python3 scripts/dependency_audit.py fetch-scanner \
            --policy security/dependency-audit-policy.json \
            --platform darwin-arm64 \
            --output "$RUNNER_TEMP/osv-scanner"
          python3 scripts/dependency_audit.py scan \
            --scanner "$RUNNER_TEMP/osv-scanner" \
            --platform darwin-arm64 \
            --sbom "$candidate/Slipstream.spdx.json" \
            --policy security/dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --evaluation-date "$(date -u +%F)" \
            --output "$candidate/dependency-audit.json"
          python3 scripts/dependency_audit.py verify \
            --report "$candidate/dependency-audit.json" \
            --sbom "$candidate/Slipstream.spdx.json" \
            --policy security/dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target "$SLIPSTREAM_TAURI_TARGET"
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          source_archive_sha256="$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          python3 scripts/release_candidate.py create \
            --candidate-dir "$candidate" \
            --repository "${{ github.repository }}" \
            --version "$version" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --source-archive-sha256 "$source_archive_sha256" \
            --source-date-epoch "$source_date_epoch" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --app-tree "$bundle/macos/Slipstream.app"

      - name: Attest immutable release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist-candidate/*

      - name: Attest release-candidate SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist-candidate/Slipstream-macos-arm64.zip
            dist-candidate/Slipstream.app.tar.gz
            dist-candidate/Slipstream_*.dmg
          sbom-path: dist-candidate/Slipstream.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate/
          if-no-files-found: error
          retention-days: 14

      - name: Seal the single packaged build for parallel qualification
        run: |
          set -euo pipefail
          bundle="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle"
          app="$bundle/macos/Slipstream.app"
          test -d "$app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            test -f "$bundle/macos/Slipstream.app.tar.gz"
            test -f "$bundle/macos/Slipstream.app.tar.gz.sig"
            dmg_count=0
            for dmg in "$bundle"/dmg/*.dmg; do
              [ -e "$dmg" ] || continue
              dmg_count=$((dmg_count + 1))
            done
            [ "$dmg_count" -eq 1 ] || {
              echo "main packaged build must contain exactly one DMG"
              exit 1
            }
          fi
          mkdir -p dist-build
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle" \
            dist-build/Slipstream-build-bundle.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build/Slipstream-build-bundle.zip
          if-no-files-found: error
          retention-days: 7

  packaged-browser-qualification:
    needs: [changes, packaged-app-build]
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build
      - name: Unpack the exact immutable candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/qualified-app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
              "$RUNNER_TEMP/qualified-app"
          else
            mkdir -p "$RUNNER_TEMP/packaged-build"
            ditto -x -k dist-build/Slipstream-build-bundle.zip \
              "$RUNNER_TEMP/packaged-build"
            ditto "$RUNNER_TEMP/packaged-build/bundle/macos/Slipstream.app" \
              "$RUNNER_TEMP/qualified-app/Slipstream.app"
          fi
          test -d "$RUNNER_TEMP/qualified-app/Slipstream.app"
      - name: Qualify packaged lazy sandboxed browser observation
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          python3 scripts/pending_navigation_browser_probe_smoke.py \
            --app-bundle "$RUNNER_TEMP/qualified-app/Slipstream.app"

  packaged-app-lifecycle-heavy:
    needs: [changes, packaged-app-build]
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Install proven Chrome for Testing for packaged lifecycle
        id: packaged-lifecycle-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77
          install-chromedriver: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build
      - name: Unpack the exact immutable candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/qualified-app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
              "$RUNNER_TEMP/qualified-app"
          else
            mkdir -p "$RUNNER_TEMP/packaged-build"
            ditto -x -k dist-build/Slipstream-build-bundle.zip \
              "$RUNNER_TEMP/packaged-build"
            ditto "$RUNNER_TEMP/packaged-build/bundle/macos/Slipstream.app" \
              "$RUNNER_TEMP/qualified-app/Slipstream.app"
          fi
          test -d "$RUNNER_TEMP/qualified-app/Slipstream.app"
      - name: Build the unsigned Safari companion
        run: |
          set -euo pipefail
          swift test --package-path browser-companion/safari
          bash scripts/build_safari_companion.sh \
            "$RUNNER_TEMP/slipstream-safari-companion"
      - name: Packaged lifecycle, tray-crash, Chrome, and Safari sentinel smoke
        env:
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          bash scripts/run_packaged_lifecycle_smoke.sh \
            "$RUNNER_TEMP/qualified-app/Slipstream.app" \
            "${{ steps.packaged-lifecycle-chrome.outputs.chrome-path }}"
      - name: Package the qualified app
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist-ci
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/qualified-app/Slipstream.app" \
            dist-ci/Slipstream-packaged-lifecycle.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: Slipstream-packaged-lifecycle-${{ github.sha }}
          path: dist-ci/Slipstream-packaged-lifecycle.zip
          if-no-files-found: error
          retention-days: 7

  checks:
    name: checks
    if: always()
    needs:
      - changes
      - product-checks
      - chromium-webrequest-contract
      - windows-adapter-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate repository documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/check_project_state.py
          python3 -m unittest discover -s scripts -p 'test_documentation.py'
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base" "$GITHUB_SHA"
      - name: Require every applicable common CI gate
        env:
          PRODUCT: ${{ needs.changes.outputs.product }}
          WINDOWS_SCOPE: ${{ needs.changes.outputs.windows }}
          PRODUCT_CHECKS: ${{ needs.product-checks.result }}
          CHROMIUM: ${{ needs.chromium-webrequest-contract.result }}
          WINDOWS: ${{ needs.windows-adapter-contract.result }}
        run: |
          set -euo pipefail
          if [ "$PRODUCT" = false ]; then
            echo "documentation-only change: documentation validation passed"
            exit 0
          fi
          for result in "$PRODUCT_CHECKS" "$CHROMIUM"; do
            [ "$result" = success ] || {
              echo "an applicable required CI gate did not succeed: $result"
              exit 1
            }
          done
          if [ "$WINDOWS_SCOPE" = true ]; then
            [ "$WINDOWS" = success ] || {
              echo "the applicable Windows gate did not succeed: $WINDOWS"
              exit 1
            }
          else
            [ "$WINDOWS" = skipped ] || {
              echo "the Windows gate ran outside its path scope: $WINDOWS"
              exit 1
            }
          fi

  packaged-app-lifecycle:
    name: packaged-app-lifecycle
    if: always()
    needs:
      - changes
      - packaged-app-build
      - packaged-browser-qualification
      - packaged-app-lifecycle-heavy
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve the required packaged lifecycle context
        env:
          PRODUCT: ${{ needs.changes.outputs.product }}
          BUILD: ${{ needs.packaged-app-build.result }}
          BROWSER: ${{ needs.packaged-browser-qualification.result }}
          LIFECYCLE: ${{ needs.packaged-app-lifecycle-heavy.result }}
        run: |
          set -euo pipefail
          if [ "$PRODUCT" = false ]; then
            echo "documentation-only change: packaged product is unchanged"
            exit 0
          fi
          for result in "$BUILD" "$BROWSER" "$LIFECYCLE"; do
            [ "$result" = success ] || {
              echo "an applicable packaged qualification did not succeed: $result"
              exit 1
            }
          done
