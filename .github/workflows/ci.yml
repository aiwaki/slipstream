name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      geph_bootstrap: ${{ steps.scope.outputs.geph_bootstrap }}
      product: ${{ steps.scope.outputs.product }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --name-only "$base" "$GITHUB_SHA" \
            | python3 scripts/ci_scope.py \
                --event-name "$GITHUB_EVENT_NAME" \
                --github-output "$GITHUB_OUTPUT"

  product-checks:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify reviewed Geph source transition
        if: needs.changes.outputs.geph_bootstrap == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous="$(mktemp -d "$RUNNER_TEMP/geph-transition-previous.XXXXXX")"
          git cat-file -e "$BASE_SHA^{commit}"
          git show "$BASE_SHA:vendor/geph/SOURCE.json" > "$previous/SOURCE.json"
          git show "$BASE_SHA:vendor/geph/VERSION" > "$previous/VERSION"
          git show "$BASE_SHA:vendor/geph/Cargo.lock" > "$previous/Cargo.lock"
          git show "$BASE_SHA:security/geph-dependency-audit-policy.json" \
            > "$previous/dependency-audit-policy.json"
          python3 scripts/geph_vendor_source.py verify-transition \
            --previous-source "$previous/SOURCE.json" \
            --previous-version-file "$previous/VERSION" \
            --previous-cargo-lock "$previous/Cargo.lock" \
            --previous-policy "$previous/dependency-audit-policy.json" \
            --source vendor/geph/SOURCE.json \
            --version-file vendor/geph/VERSION \
            --cargo-lock vendor/geph/Cargo.lock \
            --policy security/geph-dependency-audit-policy.json

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          components: clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: "pip"
          cache-dependency-path: "spike/requirements.txt"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/src-tauri/target
            crates/slipstream-core/target
            crates/slipstream-userspace-stack-evaluation/target
            crates/slipstream-userspace-stack-effect-evaluation/target
            crates/slipstream-windows-adapter/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app-tauri/src-tauri/Cargo.lock', 'crates/slipstream-core/Cargo.lock', 'crates/slipstream-userspace-stack-evaluation/Cargo.lock', 'crates/slipstream-userspace-stack-effect-evaluation/Cargo.lock', 'crates/slipstream-windows-adapter/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Python test deps
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/requirements.txt

      - name: Check version metadata
        run: python3 scripts/sync_version.py --check

      - name: Test release metadata scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Browser companion contract
        run: |
          node --check browser-companion/chromium/content.js
          node --check browser-companion/chromium/service-worker.js
          node --check browser-companion/safari/service-worker.js
          node --test browser-companion/chromium/tests/*.test.mjs
          python3 scripts/package_chromium_companion.py \
            --output "${RUNNER_TEMP}/slipstream-chromium-store"

      - name: Appcast CLI smoke
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          printf 'test-signature\n' > /tmp/slipstream-test.sig
          python3 scripts/make_appcast.py \
            --version "$version" \
            --tag "v$version" \
            --repository "${{ github.repository }}" \
            --signature-file /tmp/slipstream-test.sig \
            --output /tmp/slipstream-latest.json \
            --pub-date 2026-07-08T12:00:00Z
          python3 -m json.tool /tmp/slipstream-latest.json >/dev/null

      - name: Route policy bundle CLI smoke
        run: |
          set -euo pipefail
          python3 scripts/make_route_policy_bundle.py \
            --generate-keypair \
            --key-id ci-test \
            --private-key-output /tmp/slipstream-route-policy.key \
            --public-keys-output /tmp/slipstream-route-policy-keys.json
          python3 scripts/make_route_policy_bundle.py \
            --bundled-manifest \
            --key-id ci-test \
            --private-key-file /tmp/slipstream-route-policy.key \
            --output /tmp/slipstream-route-policy.json \
            --public-keys-output /tmp/slipstream-route-policy-derived-keys.json
          python3 -m json.tool /tmp/slipstream-route-policy.json >/dev/null
          python3 scripts/make_route_policy_bundle.py \
            --verify \
            --bundle /tmp/slipstream-route-policy.json \
            --public-keys /tmp/slipstream-route-policy-keys.json
          python3 scripts/make_route_policy_bundle.py \
            --channel-index \
            --bundle /tmp/slipstream-route-policy.json \
            --bundle-url https://policy.example.org/channel/route-policy.json \
            --output /tmp/slipstream-route-policy-latest.json
          python3 -m json.tool /tmp/slipstream-route-policy-latest.json >/dev/null

      - name: Python compile check
        run: |
          python3 -m py_compile \
            spike/address_attempts.py \
            spike/bootstrap_asset_preflight.py \
            spike/connection_probe.py \
            spike/connection_race.py \
            spike/connection_race_io.py \
            spike/http_response_completion.py \
            spike/install_guard.py \
            spike/pending_navigation_probe_runtime.py \
            spike/route_circuit.py \
            spike/route_circuit_registry.py \
            spike/route_policy_activation.py \
            spike/route_policy_activation_adapter.py \
            spike/routing_policy.py \
            spike/routing_recovery.py \
            spike/semantic_route_signal.py \
            spike/semantic_route_signal_runtime.py \
            spike/tproxy.py \
            spike/xbox_dns.py \
            spike/test_recovery.py \
            spike/test_route_policy_activation.py \
            spike/test_route_policy_activation_adapter.py \
            spike/test_connection_race_contract.py \
            spike/test_connection_race_io.py \
            spike/test_connection_probe.py \
            spike/test_http_response_completion.py \
            spike/test_install_guard.py \
            spike/test_pending_navigation_probe_runtime.py \
            spike/test_routing_contract_vectors.py \
            spike/test_semantic_route_signal.py \
            spike/test_semantic_route_signal_runtime.py \
            spike/test_traffic_contracts.py \
            spike/test_baseline_startup.py \
            spike/test_bootstrap_asset_preflight.py \
            spike/test_tproxy_doh.py \
            spike/test_xbox_dns.py \
            scripts/pf_anchor_smoke.py \
            scripts/pf_installed_lifecycle_smoke.py \
            scripts/composed_pending_navigation_smoke.py \
            scripts/sync_version.py \
            scripts/make_appcast.py \
            scripts/dependency_audit.py \
            scripts/make_release_manifest.py \
            scripts/make_release_sbom.py \
            scripts/make_route_policy_bundle.py \
            scripts/package_chromium_companion.py \
            scripts/pending_navigation_browser_probe_smoke.py \
            scripts/packaged_transport_mechanics_smoke.py \
            scripts/release_transport_matrix.py \
            scripts/check_project_state.py \
            scripts/verify_release_artifacts.py \
            scripts/test_pf_anchor_smoke.py \
            scripts/test_pf_installed_lifecycle_smoke.py \
            scripts/test_packaged_transport_mechanics_smoke.py \
            scripts/test_release_transport_matrix.py \
            scripts/test_make_appcast.py \
            scripts/test_dependency_audit.py \
            scripts/test_make_release_manifest.py \
            scripts/test_make_release_sbom.py \
            scripts/test_make_route_policy_bundle.py \
            scripts/test_package_chromium_companion.py \
            scripts/test_browser_companion.py \
            scripts/test_slipstream_core.py \
            scripts/test_verify_release_artifacts.py

      - name: Project continuity contract
        run: python3 scripts/check_project_state.py

      - name: Core traffic contracts
        run: python3 -m pytest -q spike/test_traffic_contracts.py

      - name: Daemon unit tests
        run: python3 -m pytest -q spike

      - name: Qualify deterministic exact-host TCP fallback and QUIC v1/v2 observation matrix
        run: |
          python3 -m pytest -q \
            spike/test_tproxy_doh.py::test_quic_v1_v2_observation_and_exact_host_fallback_cover_ipv4_ipv6 \
            spike/test_tproxy_doh.py::test_packaged_transport_mechanics_selftest_covers_fixed_matrix_without_network \
            spike/test_tproxy_doh.py::test_quic_tcp_fallback_is_exactly_active_owned_geo_exit_policy_scoped \
            spike/test_tproxy_doh.py::test_quic_initial_sni_reassembles_publicly_decryptable_crypto_frames \
            spike/test_tproxy_doh.py::test_quic_v2_initial_sni_uses_rfc9369_keys_and_packet_type \
            spike/test_tproxy_doh.py::test_ipv6_quic_v2_fallback_is_exact_host_and_flow_scoped

      - name: Private PF anchor sentinel smoke
        run: sudo -E "$(command -v python3)" scripts/pf_anchor_smoke.py

      - name: Prepare Tauri test resources
        run: |
          mkdir -p app-tauri/src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          chmod +x app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          mkdir -p app-tauri/src-tauri/slipstreamd
          printf '#!/bin/sh\nexit 0\n' > app-tauri/src-tauri/slipstreamd/slipstreamd
          chmod +x app-tauri/src-tauri/slipstreamd/slipstreamd

      - name: Rust tray tests
        working-directory: app-tauri/src-tauri
        run: |
          cargo test --locked --lib --bin slipstream
          cargo test --locked --bin slipstream-browser-probe
          cargo test --locked --test updater_installer_mechanics -- --test-threads=1

      - name: Rust core tests
        run: cargo test --locked --manifest-path crates/slipstream-core/Cargo.toml

      - name: Rust Windows adapter tests
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml

      - name: Rust userspace stack evaluation tests
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml

      - name: Rust selected-stack and native connector effect tests
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml

      - name: Rust tray lint
        working-directory: app-tauri/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust core lint
        run: cargo clippy --locked --manifest-path crates/slipstream-core/Cargo.toml --all-targets -- -D warnings

      - name: Rust Windows adapter lint
        run: cargo clippy --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --all-targets -- -D warnings

      - name: Rust userspace stack evaluation lint
        run: cargo clippy --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml --all-targets -- -D warnings

      - name: Rust selected-stack and native connector effect lint
        run: cargo clippy --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml --all-targets -- -D warnings

      - name: Installed daemon lifecycle sentinel smoke
        env:
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: sudo -E "$(command -v python3)" scripts/pf_installed_lifecycle_smoke.py

  chromium-webrequest-contract:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install proven Chrome for Testing extension contract
        id: chrome-for-testing
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          # Reproducible legacy extension contract. The extensionless packaged
          # observer below remains on latest stable Chrome.
          chrome-version: 151.0.7922.77
          install-chromedriver: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Qualify unified headless Chromium observation and budgets
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          sudo -E "$(command -v python3)" \
            scripts/chromium_webrequest_event_smoke.py \
            --chrome-executable "${{ steps.chrome-for-testing.outputs.chrome-path }}"

  windows-adapter-contract:
    needs: changes
    if: needs.changes.outputs.product == 'true' && needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          components: clippy

      - name: Test Windows contracts, worker host, ownership, lifecycle state, and SCM gates
        env:
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml

      - name: Test the effect-free userspace stack evaluation
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-evaluation/Cargo.toml

      - name: Test selected-stack and native connector effect boundaries
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml

      - name: Qualify exact Windows SCM registration and removal
        env:
          SLIPSTREAM_WINDOWS_SCM_DISPOSABLE_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml service_scm::windows::tests::native_register_and_unregister_are_exact_and_disposable -- --exact --test-threads=1

      - name: Build the production host and disposable Windows fixtures
        run: cargo build --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture --bins

      - name: Qualify the composed Windows service lifecycle and compensation
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_FULL_LIFECYCLE_CI: "1"
        run: |
          $fixture = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-service.exe"
          $env:SLIPSTREAM_WINDOWS_SERVICE_FIXTURE = $fixture.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_native::windows::tests::native_full_lifecycle_and_post_commit_compensation_are_disposable -- --exact --test-threads=1

      - name: Qualify controller-process restart reconciliation
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_CONTROLLER_RESTART_CI: "1"
        run: |
          $service = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-service.exe"
          $controller = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-controller.exe"
          $env:SLIPSTREAM_WINDOWS_SERVICE_FIXTURE = $service.Path
          $env:SLIPSTREAM_WINDOWS_CONTROLLER_FIXTURE = $controller.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_controller::windows::tests::controller_process_restarts_preserve_idempotence_and_recovery_budget -- --exact --test-threads=1

      - name: Qualify the production Windows service host and manager
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_PRODUCTION_HOST_CI: "1"
        run: |
          $serviceHost = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-windows-service.exe"
          $env:SLIPSTREAM_WINDOWS_PRODUCTION_HOST = $serviceHost.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_host::windows::tests::production_host_is_self_managing_idempotent_and_stops_through_scm -- --exact --test-threads=1

      - name: Qualify the bounded native Windows direct connector
        env:
          SLIPSTREAM_WINDOWS_DIRECT_CONNECTOR_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test direct_connector_windows native_direct_connector_loopback_contract_is_bounded_and_owned -- --exact --test-threads=1

      - name: Qualify owned-client direct ingress and bounded relay backpressure
        env:
          SLIPSTREAM_WINDOWS_DIRECT_INGRESS_CI: "1"
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test direct_ingress_windows native_direct_ingress_loopback_contract_is_bounded_and_owned -- --exact --test-threads=1

      - name: Qualify the pinned signed Wintun artifacts without loading them
        shell: pwsh
        run: |
          $source = Get-Content -Raw "vendor/wintun/SOURCE.json" | ConvertFrom-Json
          $expectedUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          if ($source.source_url -ne $expectedUrl) {
            throw "Wintun fixture URL is not the reviewed official source"
          }
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "slipstream-wintun-$($source.version)"
          $archive = Join-Path $fixtureRoot "wintun-$($source.version).zip"
          $expanded = Join-Path $fixtureRoot "expanded"
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          Invoke-WebRequest -Uri $source.source_url -OutFile $archive

          $archiveFile = Get-Item -LiteralPath $archive
          if ($archiveFile.Length -ne [long]$source.archive_length) {
            throw "Wintun archive length mismatch before extraction"
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $source.archive_sha256) {
            throw "Wintun archive SHA-256 mismatch before extraction"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded

          $env:SLIPSTREAM_WINDOWS_WINTUN_CI = "1"
          $env:SLIPSTREAM_WINTUN_ARCHIVE = $archive
          $env:SLIPSTREAM_WINTUN_LICENSE = Join-Path $expanded $source.license.path
          $env:SLIPSTREAM_WINTUN_AMD64_DLL = Join-Path $expanded $source.architectures.x86_64.path
          $env:SLIPSTREAM_WINTUN_ARM64_DLL = Join-Path $expanded $source.architectures.aarch64.path
          $testName = "packet_adapter::windows::tests::official_amd64_and_arm64_artifacts_are_admitted_without_loading"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --lib $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact Wintun qualification test did not execute"
          }

      - name: Qualify empty WFP dynamic-session rollback without live filters
        shell: pwsh
        env:
          SLIPSTREAM_WINDOWS_WFP_SESSION_CI: "1"
          CARGO_TERM_COLOR: "never"
        run: |
          $testName = "wfp_session::windows::tests::empty_dynamic_session_transaction_is_disposable_and_filter_free"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --lib $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact WFP qualification test did not execute"
          }

      - name: Lint Windows contracts, ingress, worker host, ownership, lifecycle state, and SCM effects
        run: cargo clippy --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --all-targets --all-features -- -D warnings

  packaged-app-build:
    needs: changes
    if: >-
      needs.changes.outputs.product == 'true' &&
      (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.geph_bootstrap != 'true'
      )
    runs-on: macos-14
    timeout-minutes: 35
    permissions:
      attestations: read
      contents: read
    outputs:
      updater-signing-artifact-digest: ${{ steps.upload-updater-signing-input.outputs.artifact-digest }}
    env:
      SLIPSTREAM_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: spike/requirements-build.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/src-tauri/target
          key: cargo-packaged-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app-tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-packaged-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-

      - name: Require the production architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64

      - name: Build the frozen daemon
        run: |
          set -euo pipefail
          python3 -m venv spike/.buildvenv
          spike/.buildvenv/bin/python -m pip install \
            --quiet \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r spike/requirements-build.txt
          spike/.buildvenv/bin/python scripts/make_route_policy_bundle.py \
            --generate-keypair \
            --key-id ci-packaged-lifecycle \
            --private-key-output /tmp/slipstream-route-policy.key \
            --public-keys-output spike/route-policy-keys.json
          ( cd spike && .buildvenv/bin/pyinstaller --noconfirm --clean slipstreamd.spec )
          rm -rf app-tauri/src-tauri/slipstreamd
          cp -R spike/dist/slipstreamd app-tauri/src-tauri/slipstreamd
          test -x app-tauri/src-tauri/slipstreamd/slipstreamd
          /usr/bin/lipo app-tauri/src-tauri/slipstreamd/slipstreamd \
            -verify_arch arm64

      - name: Fetch and verify the recorded Geph build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          source_summary="$(python3 scripts/geph_vendor_source.py verify \
            --source vendor/geph/SOURCE.json \
            --version-file vendor/geph/VERSION \
            --cargo-lock vendor/geph/Cargo.lock)"
          tag="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["release_tag"])' \
            <<< "$source_summary")"
          release_metadata="$(mktemp "$RUNNER_TEMP/geph-release.XXXXXX")"
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            > "$release_metadata"
          python3 scripts/verify_geph_release.py verify-metadata \
            --metadata "$release_metadata" \
            --expected-tag "$tag"
          tag_ref="$(gh api \
            "repos/${{ github.repository }}/git/ref/tags/$tag")"
          tag_type="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["object"]["type"])' \
            <<< "$tag_ref")"
          [ "$tag_type" = commit ] || {
            echo "recorded Geph tag must be an immutable lightweight commit ref"
            exit 1
          }
          tag_commit="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' \
            <<< "$tag_ref")"
          [[ "$tag_commit" =~ ^[0-9a-f]{40,64}$ ]] || {
            echo "recorded Geph tag does not resolve to a full commit"
            exit 1
          }
          rm -rf /tmp/geph
          mkdir -p app-tauri/src-tauri/binaries
          rm -f \
            app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          python3 scripts/download_github_release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "$tag" \
            --output /tmp/geph \
            --pattern geph5-client \
            --pattern geph5-client.LICENSE \
            --pattern geph5-client.VERSION \
            --pattern geph5-client.SOURCE.json \
            --pattern geph5-client.Cargo.lock \
            --pattern geph5-client.spdx.json \
            --pattern geph5-client-dependency-audit.json \
            --pattern SHA256SUMS
          python3 scripts/verify_geph_release.py verify-assets \
            --release-dir /tmp/geph \
            --metadata "$release_metadata" \
            --expected-tag "$tag" \
            --source vendor/geph/SOURCE.json \
            --cargo-lock vendor/geph/Cargo.lock \
            --version-file vendor/geph/VERSION \
            --license vendor/geph/LICENSE
          python3 scripts/make_geph_vendor_sbom.py verify \
            --source vendor/geph/SOURCE.json \
            --version-file vendor/geph/VERSION \
            --cargo-lock vendor/geph/Cargo.lock \
            --repository "${{ github.repository }}" \
            --source-commit "$tag_commit" \
            --target macos-universal \
            --sbom /tmp/geph/geph5-client.spdx.json
          historical_policy="$(mktemp \
            "$RUNNER_TEMP/geph-dependency-audit-policy.XXXXXX")"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/security/geph-dependency-audit-policy.json?ref=$tag_commit" \
            > "$historical_policy"
          test -f "$historical_policy"
          test ! -L "$historical_policy"
          test -s "$historical_policy"
          python3 -m json.tool "$historical_policy" >/dev/null
          python3 scripts/dependency_audit.py verify \
            --report /tmp/geph/geph5-client-dependency-audit.json \
            --sbom /tmp/geph/geph5-client.spdx.json \
            --policy "$historical_policy" \
            --source-commit "$tag_commit" \
            --target macos-universal \
            --vendored-transitive-dependencies full
          signer_workflow="${{ github.repository }}/.github/workflows/build-geph.yml"
          provenance_json="$(mktemp \
            "$RUNNER_TEMP/geph-provenance.XXXXXX")"
          spdx_attestation_json="$(mktemp \
            "$RUNNER_TEMP/geph-spdx-attestation.XXXXXX")"
          for artifact in /tmp/geph/*; do
            if [ "$artifact" = /tmp/geph/SHA256SUMS ]; then
              gh attestation verify "$artifact" \
                --repo "${{ github.repository }}" \
                --signer-workflow "$signer_workflow" \
                --signer-digest "$tag_commit" \
                --source-digest "$tag_commit" \
                --source-ref refs/heads/main \
                --predicate-type https://slsa.dev/provenance/v1 \
                --deny-self-hosted-runners \
                --format json > "$provenance_json"
            else
              gh attestation verify "$artifact" \
                --repo "${{ github.repository }}" \
                --signer-workflow "$signer_workflow" \
                --signer-digest "$tag_commit" \
                --source-digest "$tag_commit" \
                --source-ref refs/heads/main \
                --predicate-type https://slsa.dev/provenance/v1 \
                --deny-self-hosted-runners >/dev/null
            fi
          done
          gh attestation verify /tmp/geph/geph5-client \
            --repo "${{ github.repository }}" \
            --signer-workflow "$signer_workflow" \
            --signer-digest "$tag_commit" \
            --source-digest "$tag_commit" \
            --source-ref refs/heads/main \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --deny-self-hosted-runners \
            --format json > "$spdx_attestation_json"
          python3 scripts/verify_geph_release.py verify-attestations \
            --release-dir /tmp/geph \
            --provenance-json "$provenance_json" \
            --spdx-json "$spdx_attestation_json"
          /usr/bin/lipo /tmp/geph/geph5-client \
            -verify_arch arm64 x86_64
          cp /tmp/geph/geph5-client \
            app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          chmod +x app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin
          /usr/bin/lipo \
            app-tauri/src-tauri/binaries/geph5-client-aarch64-apple-darwin \
            -verify_arch arm64

      - name: Materialize pinned Chromium headless shell
        run: |
          set -euo pipefail
          python3 scripts/materialize_chromium_headless_shell.py \
            --output app-tauri/src-tauri/chromium-headless-shell
          /usr/bin/lipo \
            app-tauri/src-tauri/chromium-headless-shell/chrome-headless-shell \
            -verify_arch arm64

      - name: Install packaged app JavaScript dependencies without lifecycle scripts
        working-directory: app-tauri
        run: npm ci --ignore-scripts

      - name: Synchronize package versions without signing credentials
        working-directory: app-tauri
        run: npm run sync-version

      - name: Package the app for pull-request qualification
        if: github.event_name == 'pull_request'
        working-directory: app-tauri
        run: |
          set -euo pipefail
          ./node_modules/.bin/tauri build \
            --config src-tauri/tauri.local.conf.json \
            --target "$SLIPSTREAM_TAURI_TARGET"

      - name: Build the packaged app with a disposable updater key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: app-tauri
        run: |
          set -euo pipefail
          fixture_key="$RUNNER_TEMP/disposable-updater.key"
          fixture_password="disposable-ci-only"
          cleanup_disposable_key() {
            rm -f "$fixture_key" "$fixture_key.pub"
          }
          trap cleanup_disposable_key EXIT
          ./node_modules/.bin/tauri signer generate \
            --ci \
            --write-keys "$fixture_key" \
            --password "$fixture_password"
          TAURI_SIGNING_PRIVATE_KEY="$(<"$fixture_key")" \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$fixture_password" \
            ./node_modules/.bin/tauri build \
              --target "$SLIPSTREAM_TAURI_TARGET"

      - name: Verify packaged resources
        run: |
          set -euo pipefail
          app="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle/macos/Slipstream.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" \
            = slipstream
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" \
            = "$(tr -d '[:space:]' < VERSION)"
          /usr/bin/lipo "$app/Contents/MacOS/slipstream" -verify_arch arm64
          /usr/bin/lipo "$app/Contents/Resources/slipstreamd/slipstreamd" \
            -verify_arch arm64
          /usr/bin/lipo "$app/Contents/MacOS/geph5-client" -verify_arch arm64
          helper="$app/Contents/MacOS/slipstream-browser-probe"
          test -x "$helper"
          /usr/bin/lipo "$helper" -verify_arch arm64
          /usr/bin/codesign --verify --strict "$helper"
          if /usr/bin/otool -L "$helper" | /usr/bin/grep -E \
            'AppKit\.framework|Cocoa\.framework|WebKit\.framework'; then
            echo "browser-probe helper links a GUI framework" >&2
            exit 1
          fi
          watchdog="$app/Contents/MacOS/slipstream-update-watchdog"
          test -x "$watchdog"
          /usr/bin/lipo "$watchdog" -verify_arch arm64
          /usr/bin/codesign --verify --strict "$watchdog"
          if /usr/bin/otool -L "$watchdog" | /usr/bin/grep -E \
            'AppKit\.framework|Cocoa\.framework|WebKit\.framework'; then
            echo "update watchdog links a GUI framework" >&2
            exit 1
          fi
          test -x "$app/Contents/Resources/chromium-headless-shell/chrome-headless-shell"
          test -f "$app/Contents/Resources/chromium-headless-shell/LICENSE.headless_shell"
          test -f "$app/Contents/Resources/chromium-headless-shell/manifest.json"
          /usr/bin/lipo \
            "$app/Contents/Resources/chromium-headless-shell/chrome-headless-shell" \
            -verify_arch arm64
          /usr/bin/codesign --verify --deep --strict "$app"
          daemon="$app/Contents/Resources/slipstreamd/slipstreamd"
          test "$("$daemon" --classify-host rr1---sn-test.googlevideo.com)" = \
            '{"host": "rr1---sn-test.googlevideo.com", "route_class": "direct_first", "service_group": "youtube_video", "strategy_set": "direct_first"}'
          test "$("$daemon" --classify-host www.youtube.com)" = \
            '{"host": "www.youtube.com", "route_class": "local_bypass", "service_group": "youtube_video", "strategy_set": "fake_only"}'

      - name: Freeze the updater archive and its exact-run signing identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          bundle="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle"
          archive="$bundle/macos/Slipstream.app.tar.gz"
          test -f "$archive"
          mkdir -p dist-updater-signing-input
          cp "$archive" dist-updater-signing-input/Slipstream.app.tar.gz
          python3 - "$archive" dist-updater-signing-input/signing-input.json <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          metadata = source.lstat()
          if not stat.S_ISREG(metadata.st_mode) or metadata.st_size <= 0:
              raise SystemExit("updater signing input must be a non-empty regular file")
          digest_builder = hashlib.sha256()
          with source.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest_builder.update(block)
          digest = digest_builder.hexdigest()
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "version": Path("VERSION").read_text(encoding="utf-8").strip(),
              "target": os.environ["SLIPSTREAM_TAURI_TARGET"],
              "archive": {
                  "name": "Slipstream.app.tar.gz",
                  "sha256": digest,
                  "size": metadata.st_size,
              },
          }
          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - id: upload-updater-signing-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: updater-signing-input-${{ github.sha }}
          path: dist-updater-signing-input/
          if-no-files-found: error
          retention-days: 7

      - name: Seal the single packaged build for parallel qualification
        run: |
          set -euo pipefail
          bundle="app-tauri/src-tauri/target/${SLIPSTREAM_TAURI_TARGET}/release/bundle"
          app="$bundle/macos/Slipstream.app"
          test -d "$app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            test -f "$bundle/macos/Slipstream.app.tar.gz"
            test -f "$bundle/macos/Slipstream.app.tar.gz.sig"
            dmg_count=0
            for dmg in "$bundle"/dmg/*.dmg; do
              [ -e "$dmg" ] || continue
              dmg_count=$((dmg_count + 1))
            done
            [ "$dmg_count" -eq 1 ] || {
              echo "main packaged build must contain exactly one DMG"
              exit 1
            }
          fi
          mkdir -p dist-build
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle" \
            dist-build/Slipstream-build-bundle.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build/Slipstream-build-bundle.zip
          if-no-files-found: error
          retention-days: 7

  sign-updater-archive:
    needs: [changes, packaged-app-build]
    if: >-
      needs.changes.outputs.product == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 8
    permissions:
      actions: read
    outputs:
      updater-signature-artifact-digest: ${{ steps.upload-updater-signature.outputs.artifact-digest }}
    steps:
      # Deliberately no checkout: production signing credentials must never
      # coexist with repository code, build.rs, npm lifecycle code, or the
      # workspace-controlled node_modules tree.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-signing-input-${{ github.sha }}
          path: updater-signing-input

      - name: Verify exact-run signing input and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.packaged-app-build.outputs.updater-signing-artifact-digest }}
          ARTIFACT_NAME: updater-signing-input-${{ github.sha }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/current-run-artifacts.json"
          python3 - \
            updater-signing-input/signing-input.json \
            updater-signing-input/Slipstream.app.tar.gz \
            "$RUNNER_TEMP/current-run-artifacts.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          manifest_path, archive_path, artifacts_path = map(Path, sys.argv[1:])
          expected_files = {manifest_path.resolve(), archive_path.resolve()}
          actual_files = {
              path.resolve()
              for path in manifest_path.parent.iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if actual_files != expected_files or any(path.is_symlink() for path in manifest_path.parent.iterdir()):
              raise SystemExit("updater signing input contains an unexpected file or symlink")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "target": "aarch64-apple-darwin",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"updater signing input has invalid {key}")
          if not re.fullmatch(r"\d+\.\d+\.\d+-preview\.[1-9]\d*", manifest.get("version", "")):
              raise SystemExit("updater signing input version is not an exact preview semver")
          metadata = archive_path.lstat()
          digest_builder = hashlib.sha256()
          with archive_path.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  digest_builder.update(block)
          digest = digest_builder.hexdigest()
          archive = manifest.get("archive")
          if not stat.S_ISREG(metadata.st_mode) or archive != {
              "name": archive_path.name,
              "sha256": digest,
              "size": metadata.st_size,
          }:
              raise SystemExit("updater signing input archive identity mismatch")
          expected_digest = os.environ["EXPECTED_ARTIFACT_DIGEST"]
          # upload-artifact exposes a raw 64-hex output, while the Actions REST
          # API prefixes the same digest with "sha256:". Validate both exact
          # encodings instead of comparing unlike representations.
          if not re.fullmatch(r"[0-9a-f]{64}", expected_digest):
              raise SystemExit("updater signing artifact digest output is invalid")
          artifacts = json.loads(artifacts_path.read_text(encoding="utf-8")).get("artifacts", [])
          matches = [item for item in artifacts if item.get("name") == os.environ["ARTIFACT_NAME"]]
          if len(matches) != 1 or matches[0].get("expired") is not False:
              raise SystemExit("exact current-run updater signing artifact is unavailable")
          if matches[0].get("digest") != f"sha256:{expected_digest}":
              raise SystemExit("updater signing artifact service digest mismatch")
          PY

      - name: Bootstrap the independently checksummed Tauri signer
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/trusted-tauri-signer"
          wrapper="$RUNNER_TEMP/tauri-cli-2.11.3.tgz"
          native="$RUNNER_TEMP/tauri-cli-darwin-arm64-2.11.3.tgz"
          mkdir -p \
            "$trusted/node_modules/@tauri-apps/cli" \
            "$trusted/node_modules/@tauri-apps/cli-darwin-arm64"
          /usr/bin/curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.11.3.tgz \
            --output "$wrapper"
          /usr/bin/curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://registry.npmjs.org/@tauri-apps/cli-darwin-arm64/-/cli-darwin-arm64-2.11.3.tgz \
            --output "$native"
          printf '%s  %s\n' \
            1049507bccfcb83ecf8b9fbeb49fd47c4c16b8ad3caddde808361d7886c901bea9651af196a9a8179821e47e58bf39943e14b821109a2d2b1086f5a4adf2be19 \
            "$wrapper" \
            | shasum -a 512 -c -
          printf '%s  %s\n' \
            071a5a33c6ec0a85ecdf077858a6216acfc6d60b3bfabec1f9ee169f2464d8612854ea2e241d61a0be84e982d76435db61c8ba54576b367a1b430776b952f87b \
            "$native" \
            | shasum -a 512 -c -
          tar -xzf "$wrapper" \
            -C "$trusted/node_modules/@tauri-apps/cli" \
            --strip-components=1
          tar -xzf "$native" \
            -C "$trusted/node_modules/@tauri-apps/cli-darwin-arm64" \
            --strip-components=1
          test "$(node "$trusted/node_modules/@tauri-apps/cli/tauri.js" --version)" \
            = "tauri-cli 2.11.3"

      - name: Sign only the frozen updater archive with the production key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?main updater signing requires TAURI_SIGNING_PRIVATE_KEY}"
          archive="$GITHUB_WORKSPACE/updater-signing-input/Slipstream.app.tar.gz"
          signer="$RUNNER_TEMP/trusted-tauri-signer/node_modules/@tauri-apps/cli/tauri.js"
          before="$(shasum -a 256 "$archive" | awk '{print $1}')"
          rm -f "$archive.sig"
          (
            cd "$GITHUB_WORKSPACE/updater-signing-input"
            node "$signer" signer sign "$archive"
          )
          after="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$before" = "$after"
          test -s "$archive.sig"

      - name: Seal the signature proof after credentials leave scope
        env:
          SIGNING_INPUT_ARTIFACT_DIGEST: ${{ needs.packaged-app-build.outputs.updater-signing-artifact-digest }}
        run: |
          set -euo pipefail
          mkdir -p updater-signature
          cp updater-signing-input/Slipstream.app.tar.gz.sig updater-signature/
          python3 - \
            updater-signing-input/signing-input.json \
            updater-signing-input/Slipstream.app.tar.gz \
            updater-signature/Slipstream.app.tar.gz.sig \
            updater-signature/signing-proof.json <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          manifest_path, archive_path, signature_path, output_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          signature_metadata = signature_path.lstat()
          if not stat.S_ISREG(signature_metadata.st_mode) or not 0 < signature_metadata.st_size <= 65536:
              raise SystemExit("updater signature must be a bounded non-empty regular file")
          archive_hash = hashlib.sha256()
          with archive_path.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  archive_hash.update(block)
          archive_digest = archive_hash.hexdigest()
          if archive_digest != manifest["archive"]["sha256"]:
              raise SystemExit("updater archive changed during signing")
          proof = {
              "schema_version": 1,
              "repository": manifest["repository"],
              "source_commit": manifest["source_commit"],
              "workflow_run_id": manifest["workflow_run_id"],
              "workflow_run_attempt": manifest["workflow_run_attempt"],
              "version": manifest["version"],
              "archive_sha256": archive_digest,
              "signature_sha256": hashlib.sha256(signature_path.read_bytes()).hexdigest(),
              "signing_input_artifact_digest": os.environ["SIGNING_INPUT_ARTIFACT_DIGEST"],
              "signer": {
                  "name": "@tauri-apps/cli-darwin-arm64",
                  "version": "2.11.3",
                  "npm_tarball_sha512": "071a5a33c6ec0a85ecdf077858a6216acfc6d60b3bfabec1f9ee169f2464d8612854ea2e241d61a0be84e982d76435db61c8ba54576b367a1b430776b952f87b",
              },
          }
          output_path.write_text(json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - id: upload-updater-signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-signature-${{ github.sha }}
          path: updater-signature/
          if-no-files-found: error
          retention-days: 7

  assemble-release-candidate:
    needs: [changes, packaged-app-build, sign-updater-archive]
    if: >-
      needs.changes.outputs.product == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 18
    permissions:
      actions: read
      contents: read
    env:
      SLIPSTREAM_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-signing-input-${{ github.sha }}
          path: updater-signing-input

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updater-signature-${{ github.sha }}
          path: updater-signature

      - name: Bind downloaded artifacts to this exact run and source
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_INPUT_ARTIFACT_DIGEST: ${{ needs.packaged-app-build.outputs.updater-signing-artifact-digest }}
          SIGNATURE_ARTIFACT_DIGEST: ${{ needs.sign-updater-archive.outputs.updater-signature-artifact-digest }}
        run: |
          set -euo pipefail
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/current-run-artifacts.json"
          python3 - \
            updater-signing-input/signing-input.json \
            updater-signing-input/Slipstream.app.tar.gz \
            updater-signature/signing-proof.json \
            updater-signature/Slipstream.app.tar.gz.sig \
            "$RUNNER_TEMP/current-run-artifacts.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          manifest_path, archive_path, proof_path, signature_path, artifacts_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          archive_hash = hashlib.sha256()
          with archive_path.open("rb") as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  archive_hash.update(block)
          archive_digest = archive_hash.hexdigest()
          signature_digest = hashlib.sha256(signature_path.read_bytes()).hexdigest()
          expected_identity = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "version": Path("VERSION").read_text(encoding="utf-8").strip(),
          }
          for key, value in expected_identity.items():
              if manifest.get(key) != value or proof.get(key) != value:
                  raise SystemExit(f"updater signing artifacts have invalid {key}")
          if manifest.get("archive", {}).get("sha256") != archive_digest:
              raise SystemExit("updater signing input digest mismatch")
          if proof.get("archive_sha256") != archive_digest or proof.get("signature_sha256") != signature_digest:
              raise SystemExit("updater signature proof digest mismatch")
          if proof.get("signing_input_artifact_digest") != os.environ["SIGNING_INPUT_ARTIFACT_DIGEST"]:
              raise SystemExit("updater signature proof escaped its input artifact")
          for path in (archive_path, signature_path):
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or path.is_symlink() or metadata.st_size <= 0:
                  raise SystemExit("updater signing artifact is not a non-empty regular file")
          expected_artifacts = {
              f"updater-signing-input-{os.environ['GITHUB_SHA']}": os.environ["SIGNING_INPUT_ARTIFACT_DIGEST"],
              f"updater-signature-{os.environ['GITHUB_SHA']}": os.environ["SIGNATURE_ARTIFACT_DIGEST"],
          }
          for digest in expected_artifacts.values():
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit("updater artifact digest output is invalid")
          artifacts = json.loads(artifacts_path.read_text(encoding="utf-8")).get("artifacts", [])
          for name, digest in expected_artifacts.items():
              matches = [item for item in artifacts if item.get("name") == name]
              if (
                  len(matches) != 1
                  or matches[0].get("expired") is not False
                  or matches[0].get("digest") != f"sha256:{digest}"
              ):
                  raise SystemExit(f"current-run artifact service identity mismatch for {name}")
          PY

      - name: Restore the single packaged build and production signature
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packaged-build"
          ditto -x -k dist-build/Slipstream-build-bundle.zip \
            "$RUNNER_TEMP/packaged-build"
          bundle="$RUNNER_TEMP/packaged-build/bundle"
          cmp \
            updater-signing-input/Slipstream.app.tar.gz \
            "$bundle/macos/Slipstream.app.tar.gz"
          rm -f "$bundle/macos/Slipstream.app.tar.gz.sig"
          cp updater-signature/Slipstream.app.tar.gz.sig \
            "$bundle/macos/Slipstream.app.tar.gz.sig"
          python3 scripts/verify_updater_artifacts.py \
            --release-dir "$bundle/macos" \
            --version "$(tr -d '[:space:]' < VERSION)" \
            --tauri-config app-tauri/src-tauri/tauri.conf.json

      - name: Assemble immutable main release candidate without rebuilding
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/packaged-build/bundle"
          candidate="dist-candidate"
          mkdir -p "$candidate"
          ditto -c -k --keepParent \
            "$bundle/macos/Slipstream.app" \
            "$candidate/Slipstream-macos-arm64.zip"
          cp "$bundle/macos/Slipstream.app.tar.gz" "$candidate/"
          cp "$bundle/macos/Slipstream.app.tar.gz.sig" "$candidate/"
          dmg_count=0
          for dmg in "$bundle"/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "$candidate/"
            dmg_count=$((dmg_count + 1))
          done
          [ "$dmg_count" -eq 1 ] || {
            echo "expected exactly one release-candidate DMG, found $dmg_count"
            exit 1
          }
          cargo metadata \
            --manifest-path app-tauri/src-tauri/Cargo.toml \
            --locked \
            --filter-platform "$SLIPSTREAM_TAURI_TARGET" \
            --format-version 1 \
            > "$RUNNER_TEMP/slipstream-cargo-metadata.json"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          version="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/make_release_sbom.py \
            --version "$version" \
            --tag "release-candidate-$GITHUB_SHA" \
            --repository "${{ github.repository }}" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --cargo-lock app-tauri/src-tauri/Cargo.lock \
            --cargo-metadata "$RUNNER_TEMP/slipstream-cargo-metadata.json" \
            --npm-lock app-tauri/package-lock.json \
            --python-lock spike/requirements-runtime.txt \
            --geph-version-file vendor/geph/VERSION \
            --geph-source-file vendor/geph/SOURCE.json \
            --tg-ws-proxy-version-file vendor/tg-ws-proxy/VERSION \
            --chromium-headless-shell-source-file vendor/chromium-headless-shell/SOURCE.json \
            --output "$candidate/Slipstream.spdx.json"
          python3 scripts/dependency_audit.py fetch-scanner \
            --policy security/dependency-audit-policy.json \
            --platform darwin-arm64 \
            --output "$RUNNER_TEMP/osv-scanner"
          python3 scripts/dependency_audit.py scan \
            --scanner "$RUNNER_TEMP/osv-scanner" \
            --platform darwin-arm64 \
            --sbom "$candidate/Slipstream.spdx.json" \
            --policy security/dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --evaluation-date "$(date -u +%F)" \
            --output "$candidate/dependency-audit.json"
          python3 scripts/dependency_audit.py verify \
            --report "$candidate/dependency-audit.json" \
            --sbom "$candidate/Slipstream.spdx.json" \
            --policy security/dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target "$SLIPSTREAM_TAURI_TARGET"
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          source_archive_sha256="$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          python3 scripts/release_candidate.py create \
            --candidate-dir "$candidate" \
            --repository "${{ github.repository }}" \
            --version "$version" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --source-archive-sha256 "$source_archive_sha256" \
            --source-date-epoch "$source_date_epoch" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --app-tree "$bundle/macos/Slipstream.app"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate/
          if-no-files-found: error
          retention-days: 14

  attest-release-candidate:
    needs: [changes, assemble-release-candidate]
    if: >-
      needs.changes.outputs.product == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate

      - name: Attest immutable release candidate
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist-candidate/*

      - name: Attest release-candidate SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist-candidate/Slipstream-macos-arm64.zip
            dist-candidate/Slipstream.app.tar.gz
            dist-candidate/Slipstream_*.dmg
          sbom-path: dist-candidate/Slipstream.spdx.json

  packaged-browser-qualification:
    needs: [changes, packaged-app-build, assemble-release-candidate]
    if: >-
      always() &&
      needs.changes.outputs.product == 'true' &&
      needs.packaged-app-build.result == 'success' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.assemble-release-candidate.result == 'success'
        )
      )
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build
      - name: Unpack the exact immutable candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/qualified-app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
              "$RUNNER_TEMP/qualified-app"
          else
            mkdir -p "$RUNNER_TEMP/packaged-build"
            ditto -x -k dist-build/Slipstream-build-bundle.zip \
              "$RUNNER_TEMP/packaged-build"
            ditto "$RUNNER_TEMP/packaged-build/bundle/macos/Slipstream.app" \
              "$RUNNER_TEMP/qualified-app/Slipstream.app"
          fi
          test -d "$RUNNER_TEMP/qualified-app/Slipstream.app"
      - name: Qualify packaged lazy sandboxed browser observation
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          python3 scripts/pending_navigation_browser_probe_smoke.py \
            --app-bundle "$RUNNER_TEMP/qualified-app/Slipstream.app"

  packaged-update-notification-qualification:
    needs: [changes, assemble-release-candidate]
    if: >-
      always() &&
      needs.changes.outputs.product == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.assemble-release-candidate.result == 'success'
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
      - name: Unpack the exact candidate for native notification qualification
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/update-notification-app"
          ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
            "$RUNNER_TEMP/update-notification-app"
          test -d "$RUNNER_TEMP/update-notification-app/Slipstream.app"
      - name: Qualify exact attributed update notification without activation
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          python3 scripts/macos_update_notification_smoke.py \
            --candidate-dir dist-candidate \
            --app-bundle "$RUNNER_TEMP/update-notification-app/Slipstream.app" \
            --repository "${{ github.repository }}" \
            --source-commit "$GITHUB_SHA" \
            --candidate-run-id "$GITHUB_RUN_ID" \
            --candidate-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/update-notification-qualification.json"
      - name: Upload native notification qualification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Slipstream-update-notification-qualified-${{ github.sha }}
          path: ${{ runner.temp }}/update-notification-qualification.json
          if-no-files-found: error
          retention-days: 7

  packaged-app-lifecycle-heavy:
    needs: [changes, packaged-app-build, assemble-release-candidate]
    if: >-
      always() &&
      needs.changes.outputs.product == 'true' &&
      needs.packaged-app-build.result == 'success' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.assemble-release-candidate.result == 'success'
        )
      )
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Install proven Chrome for Testing for packaged lifecycle
        id: packaged-lifecycle-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.77
          install-chromedriver: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: packaged-app-build-${{ github.sha }}
          path: dist-build
      - name: Unpack the exact immutable candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/qualified-app"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            ditto -x -k dist-candidate/Slipstream-macos-arm64.zip \
              "$RUNNER_TEMP/qualified-app"
          else
            mkdir -p "$RUNNER_TEMP/packaged-build"
            ditto -x -k dist-build/Slipstream-build-bundle.zip \
              "$RUNNER_TEMP/packaged-build"
            ditto "$RUNNER_TEMP/packaged-build/bundle/macos/Slipstream.app" \
              "$RUNNER_TEMP/qualified-app/Slipstream.app"
          fi
          test -d "$RUNNER_TEMP/qualified-app/Slipstream.app"
      - name: Build the unsigned Safari companion
        run: |
          set -euo pipefail
          swift test --package-path browser-companion/safari
          bash scripts/build_safari_companion.sh \
            "$RUNNER_TEMP/slipstream-safari-companion"
      - name: Packaged lifecycle, tray-crash, Chrome, and Safari sentinel smoke
        env:
          SLIPSTREAM_DISPOSABLE_CI: "1"
        run: |
          bash scripts/run_packaged_lifecycle_smoke.sh \
            "$RUNNER_TEMP/qualified-app/Slipstream.app" \
            "${{ steps.packaged-lifecycle-chrome.outputs.chrome-path }}"
      - name: Package the qualified app
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist-ci
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/qualified-app/Slipstream.app" \
            dist-ci/Slipstream-packaged-lifecycle.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: Slipstream-packaged-lifecycle-${{ github.sha }}
          path: dist-ci/Slipstream-packaged-lifecycle.zip
          if-no-files-found: error
          retention-days: 7

  checks:
    name: checks
    if: always()
    needs:
      - changes
      - product-checks
      - chromium-webrequest-contract
      - windows-adapter-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate repository documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 scripts/check_project_state.py
          python3 -m unittest discover -s scripts -p 'test_documentation.py'
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base" "$GITHUB_SHA"
      - name: Require every applicable common CI gate
        env:
          PRODUCT: ${{ needs.changes.outputs.product }}
          GEPH_BOOTSTRAP: ${{ needs.changes.outputs.geph_bootstrap }}
          EVENT_NAME: ${{ github.event_name }}
          WINDOWS_SCOPE: ${{ needs.changes.outputs.windows }}
          PRODUCT_CHECKS: ${{ needs.product-checks.result }}
          CHROMIUM: ${{ needs.chromium-webrequest-contract.result }}
          WINDOWS: ${{ needs.windows-adapter-contract.result }}
        run: |
          set -euo pipefail
          if [ "$PRODUCT" = false ]; then
            [ "$GEPH_BOOTSTRAP" = false ] || {
              echo "a non-product change cannot use the Geph bootstrap path"
              exit 1
            }
            echo "documentation-only change: documentation validation passed"
            exit 0
          fi
          if [ "$GEPH_BOOTSTRAP" = true ]; then
            [ "$EVENT_NAME" = pull_request ] || {
              echo "main cannot use the Geph bootstrap path"
              exit 1
            }
            echo "Geph source-contract PR: common gates and required dependency audit apply"
          elif [ "$GEPH_BOOTSTRAP" != false ]; then
            echo "unknown Geph bootstrap classification: $GEPH_BOOTSTRAP"
            exit 1
          fi
          for result in "$PRODUCT_CHECKS" "$CHROMIUM"; do
            [ "$result" = success ] || {
              echo "an applicable required CI gate did not succeed: $result"
              exit 1
            }
          done
          if [ "$WINDOWS_SCOPE" = true ]; then
            [ "$WINDOWS" = success ] || {
              echo "the applicable Windows gate did not succeed: $WINDOWS"
              exit 1
            }
          else
            [ "$WINDOWS" = skipped ] || {
              echo "the Windows gate ran outside its path scope: $WINDOWS"
              exit 1
            }
          fi

  packaged-app-lifecycle:
    name: packaged-app-lifecycle
    if: always()
    needs:
      - changes
      - packaged-app-build
      - sign-updater-archive
      - assemble-release-candidate
      - attest-release-candidate
      - packaged-browser-qualification
      - packaged-update-notification-qualification
      - packaged-app-lifecycle-heavy
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve the required packaged lifecycle context
        env:
          PRODUCT: ${{ needs.changes.outputs.product }}
          GEPH_BOOTSTRAP: ${{ needs.changes.outputs.geph_bootstrap }}
          BUILD: ${{ needs.packaged-app-build.result }}
          SIGNER: ${{ needs.sign-updater-archive.result }}
          ASSEMBLY: ${{ needs.assemble-release-candidate.result }}
          ATTESTATION: ${{ needs.attest-release-candidate.result }}
          BROWSER: ${{ needs.packaged-browser-qualification.result }}
          UPDATE_NOTIFICATION: ${{ needs.packaged-update-notification-qualification.result }}
          LIFECYCLE: ${{ needs.packaged-app-lifecycle-heavy.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$PRODUCT" = false ]; then
            [ "$GEPH_BOOTSTRAP" = false ] || {
              echo "a non-product change cannot use the Geph bootstrap path"
              exit 1
            }
            echo "documentation-only change: packaged product is unchanged"
            exit 0
          fi
          if [ "$GEPH_BOOTSTRAP" = true ]; then
            [ "$EVENT_NAME" = pull_request ] || {
              echo "main cannot use the Geph bootstrap path"
              exit 1
            }
            for result in "$BUILD" "$SIGNER" "$ASSEMBLY" "$ATTESTATION" \
              "$BROWSER" "$UPDATE_NOTIFICATION" "$LIFECYCLE"; do
              [ "$result" = skipped ] || {
                echo "a packaged gate ran before the reviewed Geph binary existed: $result"
                exit 1
              }
            done
            echo "Geph source-contract bootstrap: packaged binary waits for main"
            exit 0
          elif [ "$GEPH_BOOTSTRAP" != false ]; then
            echo "unknown Geph bootstrap classification: $GEPH_BOOTSTRAP"
            exit 1
          fi
          for result in "$BUILD" "$BROWSER" "$LIFECYCLE"; do
            [ "$result" = success ] || {
              echo "an applicable packaged qualification did not succeed: $result"
              exit 1
            }
          done
          if [ "$EVENT_NAME" = push ] && [ "$EVENT_REF" = refs/heads/main ]; then
            for result in "$SIGNER" "$ASSEMBLY" "$UPDATE_NOTIFICATION"; do
              [ "$result" = success ] || {
                echo "an exact-main updater signing/candidate/notification gate did not succeed: $result"
                exit 1
              }
            done
            [ "$ATTESTATION" = success ] || {
              echo "the isolated release-candidate attestation did not succeed: $ATTESTATION"
              exit 1
            }
          else
            for result in "$SIGNER" "$ASSEMBLY" "$UPDATE_NOTIFICATION"; do
              [ "$result" = skipped ] || {
                echo "a main-only updater gate ran outside exact main: $result"
                exit 1
              }
            done
            [ "$ATTESTATION" = skipped ] || {
              echo "release-candidate attestation ran outside exact main: $ATTESTATION"
              exit 1
            }
          fi
