name: safari-session-smoke

on:
  pull_request:
    paths:
      - .github/workflows/safari-session-smoke.yml
      - .github/workflows/release-readiness.yml
      - scripts/safari_session_smoke.py
      - scripts/test_safari_session_smoke.py
      - scripts/pf_installed_lifecycle_smoke.py
      - scripts/test_pf_installed_lifecycle_smoke.py
      - scripts/live_site_release_smoke.py
      - scripts/test_live_site_release_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-session:
    name: Safari session (${{ matrix.strategy }})
    runs-on: macos-15
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        strategy: [normal, none]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
      - name: Check isolated session evidence contracts
        run: python3 -m unittest discover -s scripts -p test_safari_session_smoke.py
      - name: Create one session, navigate about:blank and clean up
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          SLIPSTREAM_DISPOSABLE_CI: "1"
          SESSION_STRATEGY: ${{ matrix.strategy }}
        run: |
          python3 scripts/safari_session_smoke.py \
            --strategy "$SESSION_STRATEGY" \
            --output "$RUNNER_TEMP/safari-session/report.json"
      - name: Retain only structured session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safari-session-${{ matrix.strategy }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safari-session/report.json
          if-no-files-found: error
          retention-days: 7
