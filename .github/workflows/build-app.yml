# Promote an immutable, already built and qualified release candidate.
#
# Required main CI is the only workflow that runs PyInstaller/Tauri and creates
# release-candidate-${SHA}.  One protected release-readiness workflow holds one
# account-backed Geph session across ownership proof, the live browser matrix,
# and the measured soak.  This publisher fails closed unless every exact-SHA
# proof verifies; it creates only tag-specific metadata and never rebuilds or
# re-qualifies the application.
name: build-app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional package version override; must match VERSION including preview sequence. Manual runs produce prereleases."
        required: false
      preview_sequence:
        description: "Preview sequence. This P0 release must be 23."
        required: true
        default: "23"
      release_candidate_run_id:
        description: "Optional successful ci.yml main run ID for this exact SHA."
        required: false
      dependency_audit_run_id:
        description: "Optional successful dependency-audit.yml main run ID for this exact SHA."
        required: false
      qualification_run_id:
        description: "Deprecated compatibility input; if set, it must equal readiness_run_id."
        required: false
      readiness_run_id:
        description: "Optional successful protected release-readiness run ID for this exact SHA."
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    env:
      SLIPSTREAM_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - name: Keep incomplete stable channel closed
        if: github.event_name == 'push'
        run: |
          echo "::error::Stable release publication is disabled until Developer ID signing, hardened runtime, notarization, and stapling are implemented."
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Resolve version and tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_v="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            v="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            [ "$v" = "$repo_v" ] || {
              echo "tag $tag does not match VERSION ($repo_v)"
              exit 1
            }
            channel=stable
            prerelease=false
            make_latest=true
            release_name="Slipstream $v"
          else
            [ "$GITHUB_REF" = refs/heads/main ] || {
              echo "manual preview releases must run from refs/heads/main"
              exit 1
            }
            input_v="${{ github.event.inputs.version }}"
            [ -z "$input_v" ] || [ "$input_v" = "$repo_v" ] || {
              echo "workflow version $input_v does not match VERSION ($repo_v)"
              exit 1
            }
            v="$repo_v"
            preview_sequence="${{ github.event.inputs.preview_sequence }}"
            case "$preview_sequence" in
              ''|*[!0-9]*) echo "preview_sequence must be a positive integer"; exit 1 ;;
            esac
            [ "$preview_sequence" = 23 ] || {
              echo "the next P0 release must use preview sequence 23"
              exit 1
            }
            [ "$v" = "0.1.9-preview.${preview_sequence}" ] || {
              echo "VERSION must encode the exact preview package version 0.1.9-preview.${preview_sequence}"
              exit 1
            }
            tag="v${v}"
            channel=preview
            prerelease=true
            make_latest=false
            release_name="Slipstream $v"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          existing_tag_count="$(gh api \
            "repos/${{ github.repository }}/git/matching-refs/tags/$tag" \
            --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")"
          existing_release_ids="$(gh api --paginate \
            "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          resume_release_id=
          if [ "$existing_tag_count" = 0 ] && [ -z "$existing_release_ids" ]; then
            :
          elif [ "$existing_tag_count" = 1 ]; then
            release_count="$(printf '%s\n' "$existing_release_ids" | awk 'NF { count += 1 } END { print count + 0 }')"
            [ "$release_count" = 1 ] || {
              echo "release or Git tag collision is not uniquely resumable: $tag"
              exit 1
            }
            resume_release_id="$(printf '%s\n' "$existing_release_ids" | sed -n '1p')"
            [[ "$resume_release_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "existing release ID is invalid: $resume_release_id"
              exit 1
            }
            existing_release="$(gh api \
              "repos/${{ github.repository }}/releases/$resume_release_id")"
            python3 -c '
          import json
          import sys
          release = json.load(sys.stdin)
          release_id, tag, name, source, prerelease = sys.argv[1:]
          expected = {
              "id": int(release_id),
              "tag_name": tag,
              "name": name,
              "target_commitish": source,
              "draft": False,
              "prerelease": prerelease == "true",
          }
          for key, value in expected.items():
              if release.get(key) != value:
                  raise SystemExit(
                      f"existing release is not an exact resumable publication: {key}"
                  )
          if not isinstance(release.get("published_at"), str) or not release["published_at"]:
              raise SystemExit("existing release is not published")
          ' "$resume_release_id" "$tag" "$release_name" "$GITHUB_SHA" "$prerelease" \
              <<< "$existing_release"
            echo "::notice::resuming exact published release finalization for $tag"
          else
            echo "release or Git tag already exists and will not be overwritten: $tag"
            exit 1
          fi
          echo "resume_release_id=$resume_release_id" >> "$GITHUB_OUTPUT"

      - name: Resolve previous app release tag
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_tag="${{ steps.ver.outputs.tag }}"
          if [ "${{ steps.ver.outputs.channel }}" = preview ]; then
            prerelease=true
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$'
          else
            prerelease=false
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          filter=".[] | select(.draft | not) | select(.tag_name != \"$current_tag\") | select(.tag_name | test(\"$tag_pattern\")) | select(.prerelease == $prerelease) | .tag_name"
          previous_tag="$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq "$filter" | sed -n '1p')"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve exact candidate and qualification runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_INPUT: ${{ github.event.inputs.release_candidate_run_id }}
          DEPENDENCY_AUDIT_INPUT: ${{ github.event.inputs.dependency_audit_run_id }}
          QUALIFICATION_INPUT: ${{ github.event.inputs.qualification_run_id }}
          READINESS_INPUT: ${{ github.event.inputs.readiness_run_id }}
        run: |
          set -euo pipefail
          candidate_run="$CANDIDATE_INPUT"
          dependency_audit_run="$DEPENDENCY_AUDIT_INPUT"
          qualification_run="$QUALIFICATION_INPUT"
          readiness_run="$READINESS_INPUT"
          if [ -z "$candidate_run" ]; then
            candidate_run="$(gh api --paginate \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | select(.conclusion == \"success\") | .id" \
              | sed -n '1p')"
          fi
          if [ -z "$dependency_audit_run" ]; then
            dependency_audit_run="$(gh api --paginate \
              "repos/${{ github.repository }}/actions/workflows/dependency-audit.yml/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | select(.conclusion == \"success\") | .id" \
              | sed -n '1p')"
          fi
          if [ -z "$readiness_run" ]; then
            readiness_run="$(gh api --paginate \
              "repos/${{ github.repository }}/actions/workflows/release-readiness.yml/runs?branch=main&event=workflow_dispatch&status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | select(.conclusion == \"success\") | .id" \
              | sed -n '1p')"
          fi
          if [ -z "$qualification_run" ]; then
            qualification_run="$readiness_run"
          fi
          [ -n "$candidate_run" ] || {
            echo "missing successful ci.yml run for $GITHUB_SHA"
            exit 1
          }
          [ -n "$dependency_audit_run" ] || {
            echo "missing successful dependency-audit.yml run for $GITHUB_SHA"
            exit 1
          }
          [ -n "$readiness_run" ] || {
            echo "missing successful release-readiness.yml run for $GITHUB_SHA"
            exit 1
          }
          [ "$qualification_run" = "$readiness_run" ] || {
            echo "qualification and readiness must use one protected workflow run"
            exit 1
          }
          candidate_metadata="$(gh api \
            "repos/${{ github.repository }}/actions/runs/$candidate_run")"
          dependency_audit_metadata="$(gh api \
            "repos/${{ github.repository }}/actions/runs/$dependency_audit_run")"
          readiness_metadata="$(gh api \
            "repos/${{ github.repository }}/actions/runs/$readiness_run")"
          python3 -c '
          import json
          import sys
          run = json.load(sys.stdin)
          expected_sha, repository, event, workflow = sys.argv[1:]
          expected = {
              "head_sha": expected_sha,
              "head_branch": "main",
              "event": event,
              "conclusion": "success",
              "path": f".github/workflows/{workflow}",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"run has invalid {key}: {run.get(key)!r}")
          if (run.get("head_repository") or {}).get("full_name") != repository:
              raise SystemExit("run belongs to a different repository")
          if not isinstance(run.get("run_attempt"), int) or run["run_attempt"] <= 0:
              raise SystemExit("run attempt is invalid")
          ' "$GITHUB_SHA" "${{ github.repository }}" push ci.yml \
            <<< "$candidate_metadata"
          python3 -c '
          import json
          import sys
          run = json.load(sys.stdin)
          expected_sha, repository, event, workflow = sys.argv[1:]
          expected = {
              "head_sha": expected_sha,
              "head_branch": "main",
              "event": event,
              "conclusion": "success",
              "path": f".github/workflows/{workflow}",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"run has invalid {key}: {run.get(key)!r}")
          if (run.get("head_repository") or {}).get("full_name") != repository:
              raise SystemExit("run belongs to a different repository")
          if not isinstance(run.get("run_attempt"), int) or run["run_attempt"] <= 0:
              raise SystemExit("run attempt is invalid")
          ' "$GITHUB_SHA" "${{ github.repository }}" push \
            dependency-audit.yml <<< "$dependency_audit_metadata"
          dependency_audit_attempt="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["run_attempt"])' \
            <<< "$dependency_audit_metadata")"
          dependency_audit_jobs="$(gh api \
            "repos/${{ github.repository }}/actions/runs/$dependency_audit_run/jobs?filter=latest&per_page=100")"
          python3 -c '
          import json
          import sys
          payload = json.load(sys.stdin)
          expected_attempt = int(sys.argv[1])
          jobs = payload.get("jobs")
          total = payload.get("total_count")
          if not isinstance(jobs, list) or total != len(jobs):
              raise SystemExit("dependency audit job list is incomplete")
          required = ("audit", "geph-vendor-audit", "Required dependency audit")
          for name in required:
              matches = [job for job in jobs if job.get("name") == name]
              if len(matches) != 1:
                  raise SystemExit(
                      f"dependency audit must contain exactly one {name!r} job"
                  )
              job = matches[0]
              if job.get("run_attempt") != expected_attempt:
                  raise SystemExit(
                      f"dependency audit job {name!r} belongs to another run attempt"
                  )
              if job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit(
                      f"dependency audit job {name!r} did not complete successfully"
                  )
          ' "$dependency_audit_attempt" <<< "$dependency_audit_jobs"
          python3 -c '
          import json
          import sys
          run = json.load(sys.stdin)
          expected_sha, repository, event, workflow = sys.argv[1:]
          expected = {
              "head_sha": expected_sha,
              "head_branch": "main",
              "event": event,
              "conclusion": "success",
              "path": f".github/workflows/{workflow}",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"run has invalid {key}: {run.get(key)!r}")
          if (run.get("head_repository") or {}).get("full_name") != repository:
              raise SystemExit("run belongs to a different repository")
          if not isinstance(run.get("run_attempt"), int) or run["run_attempt"] <= 0:
              raise SystemExit("run attempt is invalid")
          ' "$GITHUB_SHA" "${{ github.repository }}" workflow_dispatch \
            release-readiness.yml <<< "$readiness_metadata"
          candidate_attempt="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["run_attempt"])' \
            <<< "$candidate_metadata")"
          readiness_attempt="$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["run_attempt"])' \
            <<< "$readiness_metadata")"
          qualification_attempt="$readiness_attempt"
          echo "release_candidate_run_id=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "release_candidate_run_attempt=$candidate_attempt" >> "$GITHUB_OUTPUT"
          echo "dependency_audit_run_id=$dependency_audit_run" >> "$GITHUB_OUTPUT"
          echo "dependency_audit_run_attempt=$dependency_audit_attempt" >> "$GITHUB_OUTPUT"
          echo "qualification_run_id=$qualification_run" >> "$GITHUB_OUTPUT"
          echo "qualification_run_attempt=$qualification_attempt" >> "$GITHUB_OUTPUT"
          echo "readiness_run_id=$readiness_run" >> "$GITHUB_OUTPUT"
          echo "readiness_run_attempt=$readiness_attempt" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: dist-candidate
          run-id: ${{ steps.runs.outputs.release_candidate_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Slipstream-release-ready-${{ github.sha }}
          path: dist-readiness
          run-id: ${{ steps.runs.outputs.readiness_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Slipstream-owned-geph-qualified-${{ github.sha }}
          path: dist-qualified
          run-id: ${{ steps.runs.outputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact immutable candidate and qualification proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          source_archive_sha256="$(git archive --format=tar "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/candidate-app"
          ditto -x -k dist-candidate/Slipstream-macos-arm64.zip "$RUNNER_TEMP/candidate-app"
          python3 scripts/release_candidate.py verify \
            --candidate-dir dist-candidate \
            --repository "${{ github.repository }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --source-archive-sha256 "$source_archive_sha256" \
            --source-date-epoch "${{ steps.ver.outputs.source_date_epoch }}" \
            --target "$SLIPSTREAM_TAURI_TARGET" \
            --expected-workflow-run-id "${{ steps.runs.outputs.release_candidate_run_id }}" \
            --expected-workflow-run-attempt "${{ steps.runs.outputs.release_candidate_run_attempt }}" \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app"
          python3 scripts/release_candidate.py verify-proof \
            --candidate-dir dist-candidate \
            --proof dist-qualified/release-qualification.json \
            --expected-qualification-run-id "${{ steps.runs.outputs.qualification_run_id }}" \
            --expected-qualification-run-attempt "${{ steps.runs.outputs.qualification_run_attempt }}" \
            --expected-qualification-workflow .github/workflows/release-readiness.yml \
            --expected-candidate-run-attempt "${{ steps.runs.outputs.release_candidate_run_attempt }}"
          python3 scripts/release_readiness.py verify \
            --candidate-dir dist-candidate \
            --app-tree "$RUNNER_TEMP/candidate-app/Slipstream.app" \
            --live-report dist-readiness/live-sites.json \
            --soak-report dist-readiness/invisibility-soak.json \
            --transport-report dist-readiness/transport-mechanics.json \
            --candidate-run-id "${{ steps.runs.outputs.release_candidate_run_id }}" \
            --candidate-run-attempt "${{ steps.runs.outputs.release_candidate_run_attempt }}" \
            --readiness-run-id "${{ steps.runs.outputs.readiness_run_id }}" \
            --readiness-run-attempt "${{ steps.runs.outputs.readiness_run_attempt }}" \
            --proof dist-readiness/release-readiness.json \
            --require-passed
          signer_workflow="${{ github.repository }}/.github/workflows/ci.yml"
          for artifact in dist-candidate/*; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done
          gh attestation verify dist-qualified/release-qualification.json \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-readiness.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners >/dev/null
          for artifact in dist-readiness/*; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release-readiness.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners >/dev/null
          done
          for artifact in dist-candidate/Slipstream-macos-arm64.zip dist-candidate/Slipstream.app.tar.gz dist-candidate/Slipstream_*.dmg; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners >/dev/null
          done

      - name: Create tag-specific release metadata without rebuilding
        run: |
          set -euo pipefail
          cp -R dist-candidate dist-release
          cp dist-qualified/release-qualification.json dist-release/
          cp dist-readiness/release-readiness.json dist-release/
          cp dist-readiness/transport-mechanics.json dist-release/
          python3 scripts/make_appcast.py \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --signature-file dist-release/Slipstream.app.tar.gz.sig \
            --output dist-release/latest.json
          python3 scripts/make_release_manifest.py \
            --release-dir dist-release \
            --repository "${{ github.repository }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --channel "${{ steps.ver.outputs.channel }}" \
            --source-commit "$GITHUB_SHA" \
            --source-date-epoch "${{ steps.ver.outputs.source_date_epoch }}" \
            --target "$SLIPSTREAM_TAURI_TARGET"
          python3 scripts/verify_release_artifacts.py \
            --release-dir dist-release \
            --repository "${{ github.repository }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --channel "${{ steps.ver.outputs.channel }}" \
            --source-commit "$GITHUB_SHA" \
            --target "$SLIPSTREAM_TAURI_TARGET"

      - name: Attest tag-specific release metadata
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist-release/latest.json
            dist-release/artifact-manifest.json
            dist-release/release-qualification.json
            dist-release/release-readiness.json
            dist-release/transport-mechanics.json

      - name: Write release notes
        run: |
          set -euo pipefail
          dmg_path="$(find dist-release -maxdepth 1 -type f -name 'Slipstream_*.dmg' -print -quit)"
          [ -n "$dmg_path" ] || { echo "release DMG is missing"; exit 1; }
          dmg_name="$(basename "$dmg_path")"
          download_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/$dmg_name"
          printf '%s\n\n' "Предварительная сборка Slipstream ${{ steps.ver.outputs.version }} для macOS Apple Silicon." > dist-release/release-notes.md
          printf '## Установка\n\n[DMG для установки — `%s`](%s)\n\n' "$dmg_name" "$download_url" >> dist-release/release-notes.md
          printf '%s\n\n' "После открытия образа приложение переносится в «Программы». ZIP-архив доступен как альтернативный формат." >> dist-release/release-notes.md
          printf '> [!NOTE]\n> Preview-сборка устанавливается вручную, не заменяет stable-канал и не содержит remote policy assets. Нотарификация Apple пока отсутствует.\n\n' >> dist-release/release-notes.md
          printf '<details>\n<summary>Проверка сборки</summary>\n\n' >> dist-release/release-notes.md
          printf '%s\n' \
            '- `release-candidate-manifest.json` — исходный commit, Git tree и SHA-256 каждого immutable candidate-файла.' \
            '- `release-qualification.json` — protected gate, связанный с exact candidate manifest.' \
            '- `release-readiness.json` — Safari/Chrome live-site gate и измеренный 30-минутный invisibility soak.' \
            '- `transport-mechanics.json` — exact-candidate dual-stack PF/NATLOOK и локальная QUIC v1/v2 механика без утверждений о live-протоколе origin.' \
            '- `artifact-manifest.json` — SHA-256 и размеры опубликованных файлов.' \
            '- `Slipstream.spdx.json` и `dependency-audit.json` — состав и аудит candidate.' \
            >> dist-release/release-notes.md
          printf '\n</details>\n' >> dist-release/release-notes.md

      - name: Upload exact release draft
        id: release-draft
        if: steps.ver.outputs.resume_release_id == ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.release_name }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          make_latest: ${{ steps.ver.outputs.make_latest }}
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: dist-release/release-notes.md
          generate_release_notes: true
          previous_tag: ${{ steps.previous.outputs.tag }}
          files: |
            dist-release/Slipstream-macos-arm64.zip
            dist-release/Slipstream.app.tar.gz
            dist-release/Slipstream.app.tar.gz.sig
            dist-release/latest.json
            dist-release/artifact-manifest.json
            dist-release/release-candidate-manifest.json
            dist-release/release-qualification.json
            dist-release/release-readiness.json
            dist-release/transport-mechanics.json
            dist-release/Slipstream.spdx.json
            dist-release/dependency-audit.json
            dist-release/*.dmg

      - name: Resolve exact release transaction ID
        id: release
        env:
          CREATED_RELEASE_ID: ${{ steps.release-draft.outputs.id }}
          RESUME_RELEASE_ID: ${{ steps.ver.outputs.resume_release_id }}
        run: |
          set -euo pipefail
          if [ -n "$CREATED_RELEASE_ID" ] && [ -n "$RESUME_RELEASE_ID" ]; then
            echo "release transaction has both created and resumed IDs"
            exit 1
          fi
          release_id="${CREATED_RELEASE_ID:-$RESUME_RELEASE_ID}"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "release transaction ID is invalid"
            exit 1
          }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify the sole exact release draft before publication
        if: steps.ver.outputs.resume_release_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "release action returned an invalid draft ID"
            exit 1
          }
          draft_metadata="$(mktemp "$RUNNER_TEMP/release-draft.XXXXXX")"
          verify_draft() {
            local existing_tag_count matching_release_ids
            matching_release_ids="$(gh api --paginate \
              "repos/${{ github.repository }}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${{ steps.ver.outputs.tag }}\") | .id")" \
              || return 1
            [ "$matching_release_ids" = "$RELEASE_ID" ] || return 1
            existing_tag_count="$(gh api \
              "repos/${{ github.repository }}/git/matching-refs/tags/${{ steps.ver.outputs.tag }}" \
              --jq "[.[] | select(.ref == \"refs/tags/${{ steps.ver.outputs.tag }}\")] | length")" \
              || return 1
            [ "$existing_tag_count" = 0 ] || return 1
            gh api \
              "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              > "$draft_metadata" \
              || return 1
            python3 scripts/verify_published_release.py \
              --release-metadata "$draft_metadata" \
              --release-dir dist-release \
              --repository "${{ github.repository }}" \
              --version "${{ steps.ver.outputs.version }}" \
              --tag "${{ steps.ver.outputs.tag }}" \
              --channel "${{ steps.ver.outputs.channel }}" \
              --release-name "${{ steps.ver.outputs.release_name }}" \
              --source-commit "$GITHUB_SHA" \
              --target "$SLIPSTREAM_TAURI_TARGET" \
              --release-id "$RELEASE_ID" \
              --state draft
          }
          verified=false
          for attempt in 1 2 3 4; do
            if verify_draft; then
              verified=true
              break
            fi
            [ "$attempt" = 4 ] || sleep "$attempt"
          done
          [ "$verified" = true ] || {
            echo "exact release draft verification failed"
            exit 1
          }

      - name: Publish only the verified exact release draft
        if: steps.ver.outputs.resume_release_id == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          published=false
          for attempt in 1 2 3 4; do
            if gh api --method PATCH \
              "repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -F draft=false \
              -f make_latest="${{ steps.ver.outputs.make_latest }}" \
              > "$RUNNER_TEMP/published-release-response.json"; then
              published=true
              break
            fi
            [ "$attempt" = 4 ] || sleep "$attempt"
          done
          [ "$published" = true ] || {
            echo "::warning::publish response was inconclusive; authoritative remote verification will decide"
            exit 1
          }

      - name: Verify exact remote publication postconditions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          umask 077
          release_metadata="$(mktemp "$RUNNER_TEMP/published-release.XXXXXX")"
          tag_ref="$(mktemp "$RUNNER_TEMP/published-tag.XXXXXX")"
          verify_publication() {
            local matching_release_ids
            matching_release_ids="$(gh api --paginate \
              "repos/${{ github.repository }}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${{ steps.ver.outputs.tag }}\") | .id")" \
              || return 1
            [ "$matching_release_ids" = "$RELEASE_ID" ] || return 1
            gh api \
              "repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.tag }}" \
              > "$release_metadata" \
              || return 1
            gh api \
              "repos/${{ github.repository }}/git/ref/tags/${{ steps.ver.outputs.tag }}" \
              > "$tag_ref" \
              || return 1
            python3 scripts/verify_published_release.py \
              --release-metadata "$release_metadata" \
              --tag-ref "$tag_ref" \
              --release-dir dist-release \
              --repository "${{ github.repository }}" \
              --version "${{ steps.ver.outputs.version }}" \
              --tag "${{ steps.ver.outputs.tag }}" \
              --channel "${{ steps.ver.outputs.channel }}" \
              --release-name "${{ steps.ver.outputs.release_name }}" \
              --source-commit "$GITHUB_SHA" \
              --target "$SLIPSTREAM_TAURI_TARGET" \
              --release-id "$RELEASE_ID" \
              --state published
          }
          verified=false
          for attempt in 1 2 3 4; do
            if verify_publication; then
              verified=true
              break
            fi
            [ "$attempt" = 4 ] || sleep "$attempt"
          done
          [ "$verified" = true ] || {
            echo "remote release publication postconditions failed"
            exit 1
          }

      - name: Idempotently verify previous preview archival
        if: steps.ver.outputs.channel == 'preview' && steps.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          previous_tag="${{ steps.previous.outputs.tag }}"
          [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || {
            echo "refusing to archive non-preview tag: $previous_tag"
            exit 1
          }
          previous_metadata="$(mktemp "$RUNNER_TEMP/previous-release.XXXXXX")"
          fetch_previous() {
            gh api \
              "repos/${{ github.repository }}/releases/tags/$previous_tag" \
              > "$previous_metadata"
          }
          fetch_previous
          previous_fields="$(python3 -c '
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = sys.argv[2]
          if release.get("tag_name") != tag:
              raise SystemExit("previous release tag mismatch")
          if release.get("draft") is not False or release.get("prerelease") is not True:
              raise SystemExit("previous release is not a published preview")
          release_id = release.get("id")
          name = release.get("name")
          if isinstance(release_id, bool) or not isinstance(release_id, int) or release_id < 1:
              raise SystemExit("previous release ID is invalid")
          if not isinstance(name, str) or not name or "\n" in name or "\r" in name:
              raise SystemExit("previous release title is invalid")
          print(release_id)
          print(name)
          ' "$previous_metadata" "$previous_tag")"
          previous_id="$(printf '%s\n' "$previous_fields" | sed -n '1p')"
          previous_name="$(printf '%s\n' "$previous_fields" | sed -n '2p')"
          archival_name="$(PYTHONPATH=scripts python3 -c '
          import sys
          from verify_published_release import archival_release_name
          print(archival_release_name(sys.argv[1]))
          ' "$previous_name")"
          archive_verified=false
          for attempt in 1 2 3 4; do
            if [ "$previous_name" != "$archival_name" ]; then
              gh api --method PATCH \
                "repos/${{ github.repository }}/releases/$previous_id" \
                -f name="$archival_name" \
                > "$RUNNER_TEMP/archived-release-response.json" \
                || true
            fi
            if fetch_previous; then
              if observed_name="$(python3 -c '
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          release_id, tag, name = sys.argv[2:]
          expected = {
              "id": int(release_id),
              "tag_name": tag,
              "name": name,
              "draft": False,
              "prerelease": True,
          }
          if any(release.get(key) != value for key, value in expected.items()):
              raise SystemExit("previous release archival postcondition mismatch")
          print(release["name"])
          ' "$previous_metadata" "$previous_id" "$previous_tag" "$archival_name")"; then
                if [ "$observed_name" = "$archival_name" ]; then
                  archive_verified=true
                  break
                fi
              fi
            fi
            [ "$attempt" = 4 ] || sleep "$attempt"
          done
          [ "$archive_verified" = true ] || {
            echo "previous preview archival postcondition failed for $previous_tag"
            exit 1
          }
