# Build the exact reviewed geph5-client source graph and publish it as an
# internal Slipstream dependency. A new upstream crate first produces a PR with
# SOURCE.json and Cargo.lock, plus retirement of the exact temporary audit
# bridge when the new lock fixes it. Binaries are built only after review lands.
name: build-geph

concurrency:
  group: build-geph-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      build_reviewed:
        description: Build the reviewed main contract instead of discovering upstream
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-geph.yml"
      - "scripts/dependency_audit.py"
      - "scripts/geph_vendor_source.py"
      - "scripts/build_geph_native_release.py"
      - "scripts/geph_native_sqlite*.py"
      - "scripts/seal_geph_cargo_cache.py"
      - "scripts/verify_geph_release.py"
      - "scripts/run_geph_synthetic_tests.py"
      - "scripts/make_geph_vendor_sbom.py"
      - "security/geph-dependency-audit-policy.json"
      - "vendor/geph/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      crate_sha256: ${{ steps.upstream.outputs.crate_sha256 }}
      crate_url: ${{ steps.upstream.outputs.crate_url }}
      release_revision: ${{ steps.state.outputs.release_revision }}
      release_tag: ${{ steps.state.outputs.release_tag }}
      should_build: ${{ steps.state.outputs.should_build }}
      should_prepare: ${{ steps.state.outputs.should_prepare }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: upstream
        name: Resolve reviewed or upstream source identity
        env:
          BUILD_REVIEWED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_reviewed) }}
        run: |
          set -euo pipefail
          if [ "$BUILD_REVIEWED" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || {
              echo "reviewed dependency builds require main"; exit 1;
            }
            source_summary="$(python3 scripts/geph_vendor_source.py verify \
              --source vendor/geph/SOURCE.json --version-file vendor/geph/VERSION \
              --cargo-lock vendor/geph/Cargo.lock)"
            version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<< "$source_summary")"
            checksum="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])' <<< "$source_summary")"
            {
              echo "version=$version"
              echo "crate_sha256=$checksum"
              echo "crate_url=https://static.crates.io/crates/geph5-client/geph5-client-$version.crate"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          user_agent="slipstream-ci (+https://github.com/${{ github.repository }})"
          version="$(curl -fsSL -A "$user_agent" \
            https://crates.io/api/v1/crates/geph5-client \
            | python3 -c 'import json,sys; c=json.load(sys.stdin)["crate"]; print(c.get("max_stable_version") or c["max_version"])')"
          crate_sha256="$(curl -fsSL -A "$user_agent" \
            "https://crates.io/api/v1/crates/geph5-client/$version" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"]["checksum"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || {
            echo "invalid crates.io version: $version"; exit 1;
          }
          [[ "$crate_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "invalid crates.io checksum"; exit 1;
          }
          crate_url="https://static.crates.io/crates/geph5-client/geph5-client-$version.crate"
          {
            echo "version=$version"
            echo "crate_sha256=$crate_sha256"
            echo "crate_url=$crate_url"
          } >> "$GITHUB_OUTPUT"

      - id: state
        name: Decide whether review or build is required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.upstream.outputs.version }}"
          checksum="${{ steps.upstream.outputs.crate_sha256 }}"
          if source_summary="$(python3 scripts/geph_vendor_source.py verify \
            --source vendor/geph/SOURCE.json \
            --version-file vendor/geph/VERSION \
            --cargo-lock vendor/geph/Cargo.lock \
            --expected-version "$version" \
            --expected-crate-sha256 "$checksum" 2>/dev/null)"; then
            release_tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["release_tag"])' <<< "$source_summary")"
            {
              echo "should_prepare=false"
              echo "release_revision=${release_tag##*-r}"
              echo "release_tag=$release_tag"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "should_prepare=true"
              echo "should_build=false"
              echo "release_revision=1"
              echo "release_tag=geph-vendor-$version-r1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_build=false
          tag="$release_tag"
          required=(
            geph5-client
            geph5-client.LICENSE
            geph5-client.VERSION
            geph5-client.SOURCE.json
            geph5-client.Cargo.lock
            geph5-client.spdx.json
            geph5-client-dependency-audit.json
            SHA256SUMS
          )
          if [ "$(python3 -c 'import json,sys; print("true" if "native_sqlite" in json.load(sys.stdin) else "false")' <<< "$source_summary")" = true ]; then
            native_sqlite=true
            required+=(geph5-client-native-sqlite-evidence.tar)
          else
            native_sqlite=false
          fi
          if ! assets="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            should_build=true
          else
            for name in "${required[@]}"; do
              grep -Fxq "$name" <<< "$assets" || {
                echo "release $tag exists but is incomplete; bump release_revision instead of replacing it"
                exit 1
              }
            done
            if [ "$native_sqlite" = true ]; then
              umask 077
              geph_workspace="$(mktemp -d "$RUNNER_TEMP/geph-existing.XXXXXX")"
              geph_workspace="$(cd "$geph_workspace" && pwd -P)"
              geph_release="$geph_workspace/release"
              release_metadata="$geph_workspace/release.json"
              asset_report="$geph_workspace/verified-assets.json"
              gh api "repos/${{ github.repository }}/releases/tags/$tag" \
                > "$release_metadata"
              python3 scripts/verify_geph_release.py verify-metadata \
                --metadata "$release_metadata" \
                --expected-tag "$tag" \
                --source vendor/geph/SOURCE.json
              tag_ref="$(gh api \
                "repos/${{ github.repository }}/git/ref/tags/$tag")"
              tag_type="$(python3 -c \
                'import json,sys; print(json.load(sys.stdin)["object"]["type"])' \
                <<< "$tag_ref")"
              [ "$tag_type" = commit ] || {
                echo "recorded Geph tag must be an immutable lightweight commit ref"
                exit 1
              }
              tag_commit="$(python3 -c \
                'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' \
                <<< "$tag_ref")"
              [[ "$tag_commit" =~ ^[0-9a-f]{40,64}$ ]] || {
                echo "recorded Geph tag does not resolve to a full commit"
                exit 1
              }
              download_args=(
                --pattern geph5-client
                --pattern geph5-client.LICENSE
                --pattern geph5-client.VERSION
                --pattern geph5-client.SOURCE.json
                --pattern geph5-client.Cargo.lock
                --pattern geph5-client.spdx.json
                --pattern geph5-client-dependency-audit.json
                --pattern SHA256SUMS
              )
              asset_args=(
                --release-dir "$geph_release"
                --metadata "$release_metadata"
                --expected-tag "$tag"
                --source vendor/geph/SOURCE.json
                --cargo-lock vendor/geph/Cargo.lock
                --version-file vendor/geph/VERSION
                --license vendor/geph/LICENSE
              )
              sbom_args=(
                --source vendor/geph/SOURCE.json
                --version-file vendor/geph/VERSION
                --cargo-lock vendor/geph/Cargo.lock
                --repository "${{ github.repository }}"
                --source-commit "$tag_commit"
                --target macos-universal
                --sbom "$geph_release/geph5-client.spdx.json"
              )
              if [ "$native_sqlite" = true ]; then
                download_args+=(--pattern geph5-client-native-sqlite-evidence.tar)
                asset_args+=(--native-output-root "$geph_workspace/native-evidence")
              fi
              python3 scripts/download_github_release_assets.py \
                --repo "${{ github.repository }}" \
                --tag "$tag" \
                --output "$geph_release" \
                "${download_args[@]}"
              python3 scripts/verify_geph_release.py verify-assets \
                "${asset_args[@]}" > "$asset_report"
              if [ "$native_sqlite" = true ]; then
                # Independently materialize reviewed source; bundle files are proof,
                # never the authority for the SQLite archive or source inventory.
                crate_url="$(python3 -c 'import json; print(json.load(open("vendor/geph/SOURCE.json"))["crate"]["url"])')"
                sqlite_url="$(python3 -c 'import json; print(json.load(open("vendor/geph/SOURCE.json"))["native_sqlite"]["archive"]["url"])')"
                curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
                  "$crate_url" -o "$geph_workspace/geph5-client.crate"
                curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
                  "$sqlite_url" -o "$geph_workspace/sqlite.zip"
                python3 scripts/geph_vendor_source.py extract \
                  --source vendor/geph/SOURCE.json \
                  --version-file vendor/geph/VERSION \
                  --cargo-lock vendor/geph/Cargo.lock \
                  --crate "$geph_workspace/geph5-client.crate" \
                  --native-sqlite-archive "$geph_workspace/sqlite.zip" \
                  --output "$geph_workspace/source" \
                  > "$geph_workspace/materialized-source.json"
                source_root="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["root"])' "$geph_workspace/materialized-source.json")"
                native_receipt="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["native_evidence"]["receipt_path"])' "$asset_report")"
                native_artifacts="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["native_evidence"]["artifacts_root"])' "$asset_report")"
                sbom_args+=(--source-root "$source_root" --native-receipt "$native_receipt" --native-artifacts-root "$native_artifacts")
              fi
              python3 scripts/make_geph_vendor_sbom.py verify "${sbom_args[@]}"
              historical_policy="$(mktemp \
                "$RUNNER_TEMP/geph-dependency-audit-policy.XXXXXX")"
              gh api \
                -H "Accept: application/vnd.github.raw+json" \
                "repos/${{ github.repository }}/contents/security/geph-dependency-audit-policy.json?ref=$tag_commit" \
                > "$historical_policy"
              test -f "$historical_policy"
              test ! -L "$historical_policy"
              test -s "$historical_policy"
              python3 -m json.tool "$historical_policy" >/dev/null
              python3 scripts/dependency_audit.py verify \
                --report "$geph_release/geph5-client-dependency-audit.json" \
                --sbom "$geph_release/geph5-client.spdx.json" \
                --policy "$historical_policy" \
                --source-commit "$tag_commit" \
                --target macos-universal \
                --vendored-transitive-dependencies full
              signer_workflow="${{ github.repository }}/.github/workflows/build-geph.yml"
              provenance_json="$(mktemp \
                "$RUNNER_TEMP/geph-provenance.XXXXXX")"
              spdx_attestation_json="$(mktemp \
                "$RUNNER_TEMP/geph-spdx-attestation.XXXXXX")"
              for artifact in "$geph_release"/*; do
                if [ "$artifact" = "$geph_release/SHA256SUMS" ]; then
                  gh attestation verify "$artifact" \
                    --repo "${{ github.repository }}" \
                    --signer-workflow "$signer_workflow" \
                    --signer-digest "$tag_commit" \
                    --source-digest "$tag_commit" \
                    --source-ref refs/heads/main \
                    --predicate-type https://slsa.dev/provenance/v1 \
                    --deny-self-hosted-runners \
                    --format json > "$provenance_json"
                else
                  gh attestation verify "$artifact" \
                    --repo "${{ github.repository }}" \
                    --signer-workflow "$signer_workflow" \
                    --signer-digest "$tag_commit" \
                    --source-digest "$tag_commit" \
                    --source-ref refs/heads/main \
                    --predicate-type https://slsa.dev/provenance/v1 \
                    --deny-self-hosted-runners >/dev/null
                fi
              done
              gh attestation verify "$geph_release/geph5-client" \
                --repo "${{ github.repository }}" \
                --signer-workflow "$signer_workflow" \
                --signer-digest "$tag_commit" \
                --source-digest "$tag_commit" \
                --source-ref refs/heads/main \
                --predicate-type https://spdx.dev/Document/v2.3 \
                --deny-self-hosted-runners \
                --format json > "$spdx_attestation_json"
              python3 scripts/verify_geph_release.py verify-attestations \
                --release-dir "$geph_release" \
                --provenance-json "$provenance_json" \
                --spdx-json "$spdx_attestation_json" \
                --source vendor/geph/SOURCE.json
              # The resolver also retains the existing current-policy admission gate.
              python3 scripts/dependency_audit.py verify \
                --report "$geph_release/geph5-client-dependency-audit.json" \
                --sbom "$geph_release/geph5-client.spdx.json" \
                --policy security/geph-dependency-audit-policy.json \
                --source-commit "$tag_commit" --target macos-universal \
                --vendored-transitive-dependencies full
            else
              rm -rf /tmp/geph-existing
              python3 scripts/download_github_release_assets.py \
                --repo "${{ github.repository }}" \
                --tag "$tag" \
                --output /tmp/geph-existing \
                --pattern geph5-client.SOURCE.json \
                --pattern geph5-client.Cargo.lock \
                --pattern geph5-client.spdx.json \
                --pattern geph5-client-dependency-audit.json
              cmp vendor/geph/SOURCE.json /tmp/geph-existing/geph5-client.SOURCE.json || {
                echo "release $tag has a different source contract; bump release_revision"
                exit 1
              }
              cmp vendor/geph/Cargo.lock /tmp/geph-existing/geph5-client.Cargo.lock || {
                echo "release $tag has a different lock; bump release_revision"
                exit 1
              }
              vendor_commit="$(python3 -c 'import json; print(json.load(open("/tmp/geph-existing/geph5-client-dependency-audit.json"))["source"]["commit"])')"
              tag_commit="$(gh api "repos/${{ github.repository }}/commits/$tag" --jq .sha)"
              [ "$vendor_commit" = "$tag_commit" ] || {
                echo "release $tag audit source does not match its immutable tag"
                exit 1
              }
              python3 scripts/make_geph_vendor_sbom.py verify \
                --source vendor/geph/SOURCE.json \
                --version-file vendor/geph/VERSION \
                --cargo-lock vendor/geph/Cargo.lock \
                --repository "${{ github.repository }}" \
                --source-commit "$vendor_commit" \
                --target macos-universal \
                --sbom /tmp/geph-existing/geph5-client.spdx.json
              python3 scripts/dependency_audit.py verify \
                --report /tmp/geph-existing/geph5-client-dependency-audit.json \
                --sbom /tmp/geph-existing/geph5-client.spdx.json \
                --policy security/geph-dependency-audit-policy.json \
                --source-commit "$vendor_commit" \
                --target macos-universal \
                --vendored-transitive-dependencies full
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  bump:
    needs: resolve
    if: needs.resolve.outputs.should_prepare == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Open the reviewed-source update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          branch="automation/geph-${version}"
          curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
            "${{ needs.resolve.outputs.crate_url }}" -o /tmp/geph5-client.crate
          python3 scripts/geph_vendor_source.py prepare \
            --crate /tmp/geph5-client.crate \
            --version "$version" \
            --crate-sha256 "${{ needs.resolve.outputs.crate_sha256 }}" \
            --output-dir vendor/geph
          python3 scripts/geph_vendor_source.py retire-h2-transition-exception \
            --cargo-lock vendor/geph/Cargo.lock \
            --policy security/geph-dependency-audit-policy.json

          git checkout -B "$branch"
          git config user.name "slipstream-ci"
          git config user.email "ci@slipstream.local"
          git add -- \
            vendor/geph/VERSION \
            vendor/geph/SOURCE.json \
            vendor/geph/Cargo.lock \
            security/geph-dependency-audit-policy.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "vendor: geph5-client $version source contract"
          remote_ref="refs/heads/$branch"
          remote_oid="$(git ls-remote --heads origin "$remote_ref" | awk '{print $1}')"
          if [ -n "$remote_oid" ]; then
            git push --force-with-lease="$remote_ref:$remote_oid" origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
          body="$(cat <<EOF
          Automated Geph source-contract update.

          - exact crates.io archive SHA-256
          - freshly resolved Cargo.lock
          - reviewed features and macOS targets
          - automatic retirement of the exact temporary h2 0.4.15 bridge when fixed

          The binary is not built or published until this PR passes checks and is merged.
          EOF
          )"
          if gh pr view "$branch" --repo "${{ github.repository }}" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "${{ github.repository }}" --body "$body"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$branch" \
              --title "vendor: geph5-client $version source contract" \
              --body "$body"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: macos-14
    env:
      GEPH_TARGETS: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"

      - name: Install checked macOS build dependencies
        run: bash scripts/ensure_macos_build_deps.sh

      - id: source
        name: Materialize the reviewed Geph source
        run: |
          set -euo pipefail
          source_summary="$(python3 scripts/geph_vendor_source.py verify \
            --source vendor/geph/SOURCE.json --version-file vendor/geph/VERSION \
            --cargo-lock vendor/geph/Cargo.lock)"
          native_sqlite="$(python3 -c 'import json,sys; print("true" if "native_sqlite" in json.load(sys.stdin) else "false")' <<< "$source_summary")"
          echo "native_sqlite=$native_sqlite" >> "$GITHUB_OUTPUT"
          if [ "$native_sqlite" = true ]; then
            umask 077
            workspace="$(mktemp -d "$RUNNER_TEMP/geph-native.XXXXXX")"
            workspace="$(cd "$workspace" && pwd -P)"
            echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
            sqlite_url="$(python3 -c 'import json; print(json.load(open("vendor/geph/SOURCE.json"))["native_sqlite"]["archive"]["url"])')"
            curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
              "${{ needs.resolve.outputs.crate_url }}" -o "$workspace/geph5-client.crate"
            curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
              "$sqlite_url" -o "$workspace/sqlite.zip"
            python3 scripts/geph_vendor_source.py extract \
              --source vendor/geph/SOURCE.json --version-file vendor/geph/VERSION \
              --cargo-lock vendor/geph/Cargo.lock --crate "$workspace/geph5-client.crate" \
              --native-sqlite-archive "$workspace/sqlite.zip" --output "$workspace/source" \
              > "$workspace/materialized-source.json"
            source_root="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["root"])' "$workspace/materialized-source.json")"
            echo "root=$source_root" >> "$GITHUB_OUTPUT"
          else
            curl -fsSL -A "slipstream-ci (+https://github.com/${{ github.repository }})" \
              "${{ needs.resolve.outputs.crate_url }}" -o /tmp/geph5-client.crate
            source_json="$(python3 scripts/geph_vendor_source.py extract \
              --source vendor/geph/SOURCE.json \
              --version-file vendor/geph/VERSION \
              --cargo-lock vendor/geph/Cargo.lock \
              --crate /tmp/geph5-client.crate \
              --output /tmp/geph-source)"
            source_root="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["root"])' <<< "$source_json")"
            echo "root=$source_root" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.source.outputs.native_sqlite != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: geph-macos-universal-${{ hashFiles('vendor/geph/Cargo.lock', 'vendor/geph/SOURCE.json') }}


      - name: Build the exact locked universal binary
        run: |
          set -euo pipefail
          source_root="${{ steps.source.outputs.root }}"
          if [ "${{ steps.source.outputs.native_sqlite }}" = true ]; then
            umask 077
            workspace="${{ steps.source.outputs.workspace }}"
            repository="$(pwd -P)"
            native_output="$workspace/producer"
            # Resolve rustup shims and Xcode symlinks before entering a clean HOME.
            physical() { python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$1"; }
            python="$(physical "$(command -v python3)")"
            cargo="$(physical "$(rustup which cargo)")"
            rustc="$(physical "$(rustup which rustc)")"
            clang="$(physical "$(xcrun --find clang)")"
            ar="$(physical "$(xcrun --find ar)")"
            lipo="$(physical "$(xcrun --find lipo)")"
            sdk="$(physical "$(xcrun --sdk macosx --show-sdk-path)")"
            libclang="$(physical "$(dirname "$(dirname "$clang")")/lib/libclang.dylib")"
            cmake="$(physical "$(command -v cmake)")"
            mkdir "$workspace/home" "$workspace/tmp" "$workspace/fetched-cargo-home"
            # This full-lock fetch has no --target: seal_cache requires every
            # registry package, including host/dev and other-platform entries.
            "$python" -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from build_geph_native_release import no_cargo_config; no_cargo_config(Path(sys.argv[1]), Path(sys.argv[2]))' \
              "$workspace/home" "$workspace/fetched-cargo-home"
            (
              cd "$workspace/home"
              /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$workspace/home" \
                TMPDIR="$workspace/tmp" CARGO_HOME="$workspace/fetched-cargo-home" RUSTC="$rustc" \
                "$cargo" fetch --manifest-path "$source_root/Cargo.toml" --locked
            ) > "$workspace/online-fetch.log" 2>&1
            "$python" scripts/seal_geph_cargo_cache.py \
              --source vendor/geph/SOURCE.json --cargo-lock vendor/geph/Cargo.lock \
              --fetched-cargo-home "$workspace/fetched-cargo-home" --output "$workspace/cargo-home" \
              > "$workspace/cache-seal-result.json"
            printf '%s\n' '(version 1)' '(allow default)' '(deny network*)' > "$workspace/compile.sb"
            clean_env=(/usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C HOME="$workspace/home" TMPDIR="$workspace/tmp")
            (
              cd "$workspace/home"
              # EPERM is required; an unavailable endpoint/ECONNREFUSED is not denial.
              "${clean_env[@]}" /usr/bin/sandbox-exec -f "$workspace/compile.sb" \
                "$python" -c 'import errno,json,socket; s=socket.socket(); result=s.connect_ex(("127.0.0.1",9)); s.close(); print(json.dumps({"network_errno":result})); assert result == errno.EPERM, "compile sandbox did not deny networking"' \
                > "$workspace/network-control.json"
              "${clean_env[@]}" CARGO_HOME="$workspace/cargo-home" CARGO_NET_OFFLINE=true RUSTC="$rustc" \
                /usr/bin/sandbox-exec -f "$workspace/compile.sb" \
                "$cargo" fetch --manifest-path "$source_root/Cargo.toml" --locked --offline \
                > "$workspace/offline-fetch.log" 2>&1
              "${clean_env[@]}" /usr/bin/sandbox-exec -f "$workspace/compile.sb" \
                "$python" "$repository/scripts/build_geph_native_release.py" \
                --source "$repository/vendor/geph/SOURCE.json" --version "$repository/vendor/geph/VERSION" \
                --lock "$repository/vendor/geph/Cargo.lock" --crate "$workspace/geph5-client.crate" \
                --native-archive "$workspace/sqlite.zip" --output "$native_output" \
                --cargo-home "$workspace/cargo-home" --cargo "$cargo" --rustc "$rustc" --python "$python" \
                --clang "$clang" --ar "$ar" --lipo "$lipo" --sdk "$sdk" --libclang "$libclang" \
                --cmake "$cmake" --jobs 1 > "$workspace/producer-result.json" 2> "$workspace/producer.stderr.log"
            )
            version="$(cat vendor/geph/VERSION)"
            source_root="$native_output/source/geph5-client-$version"
            host_target="$("$python" -c 'import platform; print({"arm64":"aarch64-apple-darwin","aarch64":"aarch64-apple-darwin","x86_64":"x86_64-apple-darwin"}[platform.machine()])')"
            "$python" scripts/run_geph_synthetic_tests.py --source-root "$source_root" \
              --source-contract vendor/geph/SOURCE.json --evidence-dir "$RUNNER_TEMP/geph-synthetic-tests" \
              --native-receipt "$native_output/evidence/$host_target/native-build.json" \
              --native-artifacts-root "$native_output/evidence" --cargo-home "$workspace/cargo-home" \
              --cargo "$cargo" --rustc "$rustc" --clang "$clang" --ar "$ar" \
              --sdk "$sdk" --libclang "$libclang" --cmake "$cmake" --build-jobs 1
            mkdir out
            # The producer has sealed these exact final bytes: no strip/relink.
            cp "$native_output/evidence/geph5-client" out/geph5-client
            "$python" scripts/geph_native_sqlite_bundle.py pack \
              --source vendor/geph/SOURCE.json --cargo-lock vendor/geph/Cargo.lock \
              --receipt "$native_output/evidence/native-release.json" --artifacts-root "$native_output/evidence" \
              --published-binary out/geph5-client --output out/geph5-client-native-sqlite-evidence.tar \
              > "$workspace/bundle-result.json"
          else
            mkdir -p out /tmp/geph-metadata
            # Compile without executing upstream account/network tests. Only exact
            # reviewed fixtures run, with OS network and private-file denial.
            python3 scripts/run_geph_synthetic_tests.py --source-root "$source_root" \
              --evidence-dir "$RUNNER_TEMP/geph-synthetic-tests"
            IFS=',' read -ra targets <<< "$GEPH_TARGETS"
            bins=()
            for target in "${targets[@]}"; do
              cargo metadata \
                --manifest-path "$source_root/Cargo.toml" \
                --locked \
                --features aws_lambda \
                --filter-platform "$target" \
                --format-version 1 \
                > "/tmp/geph-metadata/$target.json"
              cargo install \
                --path "$source_root" \
                --locked \
                --target "$target" \
                --root "/tmp/geph-install-$target" \
                --no-track \
                --force \
                --features aws_lambda
              bins+=("/tmp/geph-install-$target/bin/geph5-client")
            done
            lipo -create -output out/geph5-client "${bins[@]}"
            strip -x out/geph5-client
            lipo out/geph5-client -verify_arch arm64 x86_64
            grep -aq aws_smithy out/geph5-client || {
              echo "aws_lambda feature is absent from the built binary"; exit 1;
            }
          fi

      - name: Retain isolated synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geph-synthetic-tests-${{ needs.resolve.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geph-synthetic-tests/*
          if-no-files-found: warn
          retention-days: 7

      - name: Retain native producer proof and cache controls
        if: always() && steps.source.outputs.native_sqlite == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geph-native-producer-${{ needs.resolve.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ steps.source.outputs.workspace }}/*.json
            ${{ steps.source.outputs.workspace }}/*.log
            ${{ steps.source.outputs.workspace }}/*.sb
            ${{ steps.source.outputs.workspace }}/cargo-home/cache-seal.json
            ${{ steps.source.outputs.workspace }}/producer/inputs/*
            ${{ steps.source.outputs.workspace }}/producer/producer.json
            ${{ steps.source.outputs.workspace }}/producer/logs/*
            ${{ steps.source.outputs.workspace }}/producer/evidence/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build and audit the vendored dependency inventory
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          sbom_args=(
            --source vendor/geph/SOURCE.json --version-file vendor/geph/VERSION
            --cargo-lock vendor/geph/Cargo.lock --repository "${{ github.repository }}"
            --source-commit "$GITHUB_SHA" --source-date-epoch "$source_date_epoch"
            --target macos-universal --output out/geph5-client.spdx.json
          )
          if [ "${{ steps.source.outputs.native_sqlite }}" = true ]; then
            native_output="${{ steps.source.outputs.workspace }}/producer"
            version="$(cat vendor/geph/VERSION)"
            sbom_args+=(
              --source-root "$native_output/source/geph5-client-$version"
              --native-receipt "$native_output/evidence/native-release.json"
              --native-artifacts-root "$native_output/evidence"
              --cargo-metadata "aarch64-apple-darwin=$native_output/evidence/aarch64-apple-darwin/linked/cargo_metadata"
              --cargo-metadata "x86_64-apple-darwin=$native_output/evidence/x86_64-apple-darwin/linked/cargo_metadata"
            )
          else
            sbom_args+=(
              --cargo-metadata aarch64-apple-darwin=/tmp/geph-metadata/aarch64-apple-darwin.json
              --cargo-metadata x86_64-apple-darwin=/tmp/geph-metadata/x86_64-apple-darwin.json
            )
          fi
          python3 scripts/make_geph_vendor_sbom.py generate "${sbom_args[@]}"
          python3 scripts/dependency_audit.py fetch-scanner \
            --policy security/geph-dependency-audit-policy.json \
            --platform darwin-arm64 \
            --output /tmp/osv-scanner
          python3 scripts/dependency_audit.py scan \
            --scanner /tmp/osv-scanner \
            --platform darwin-arm64 \
            --sbom out/geph5-client.spdx.json \
            --policy security/geph-dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target macos-universal \
            --vendored-transitive-dependencies full \
            --evaluation-date "$(date -u +%F)" \
            --output out/geph5-client-dependency-audit.json
          python3 scripts/dependency_audit.py verify \
            --report out/geph5-client-dependency-audit.json \
            --sbom out/geph5-client.spdx.json \
            --policy security/geph-dependency-audit-policy.json \
            --source-commit "$GITHUB_SHA" \
            --target macos-universal \
            --vendored-transitive-dependencies full

      - name: Assemble the internal release payload
        run: |
          set -euo pipefail
          cp vendor/geph/LICENSE out/geph5-client.LICENSE
          cp vendor/geph/VERSION out/geph5-client.VERSION
          cp vendor/geph/SOURCE.json out/geph5-client.SOURCE.json
          cp vendor/geph/Cargo.lock out/geph5-client.Cargo.lock
          python3 - <<'PY_ASSETS'
          import json
          from pathlib import Path
          expected = {"geph5-client", "geph5-client.LICENSE", "geph5-client.VERSION",
                      "geph5-client.SOURCE.json", "geph5-client.Cargo.lock",
                      "geph5-client.spdx.json", "geph5-client-dependency-audit.json"}
          if "native_sqlite" in json.loads(Path("vendor/geph/SOURCE.json").read_bytes()):
              expected.add("geph5-client-native-sqlite-evidence.tar")
          assert {path.name for path in Path("out").iterdir()} == expected, "unexpected release asset set"
          PY_ASSETS
          ( cd out && shasum -a 256 geph5-client* > SHA256SUMS )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geph5-client-macos-universal-${{ needs.resolve.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest Geph build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: out/*

      - name: Attest the Geph SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: out/geph5-client
          sbom-path: out/geph5-client.spdx.json

      - name: Verify stored Geph attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.source.outputs.native_sqlite }}" = true ]; then
            workspace="${{ steps.source.outputs.workspace }}"
            signer_workflow="${{ github.repository }}/.github/workflows/build-geph.yml"
            provenance_json="$workspace/provenance.json"
            spdx_attestation_json="$workspace/spdx-attestation.json"
            for artifact in out/*; do
              result=/dev/null
              [ "$artifact" != out/SHA256SUMS ] || result="$provenance_json"
              gh attestation verify "$artifact" \
                --repo "${{ github.repository }}" --signer-workflow "$signer_workflow" \
                --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
                --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1 \
                --deny-self-hosted-runners --format json > "$result"
            done
            gh attestation verify out/geph5-client \
              --repo "${{ github.repository }}" --signer-workflow "$signer_workflow" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref refs/heads/main --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners --format json > "$spdx_attestation_json"
            python3 scripts/verify_geph_release.py verify-attestations \
              --release-dir out --provenance-json "$provenance_json" \
              --spdx-json "$spdx_attestation_json" --source vendor/geph/SOURCE.json
          else
            signer_workflow="${{ github.repository }}/.github/workflows/build-geph.yml"
            for artifact in out/*; do
              gh attestation verify "$artifact" \
                --repo "${{ github.repository }}" \
                --signer-workflow "$signer_workflow" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners >/dev/null
            done
            gh attestation verify out/geph5-client \
              --repo "${{ github.repository }}" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners >/dev/null
          fi

      - name: Publish the verified internal dependency release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: "Internal dependency: geph5-client ${{ needs.resolve.outputs.version }} (r${{ needs.resolve.outputs.release_revision }})"
          prerelease: true
          make_latest: false
          overwrite_files: false
          body: |
            Internal build dependency for Slipstream. This is not an app release.

            The universal macOS binary is built from the exact crates.io archive,
            reviewed Cargo.lock, and `aws_lambda` feature recorded in SOURCE.json.
            The release includes its full transitive SPDX inventory, fail-closed
            vulnerability audit, SHA-256 manifest, and GitHub attestations.
          files: out/*
