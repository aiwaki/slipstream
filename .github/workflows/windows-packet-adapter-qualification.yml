name: windows-packet-adapter-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-packet-adapter-qualification.yml"
      - "contracts/windows-capture-generation-recovery-v1.json"
      - "contracts/windows-production-host-crash-recovery-v1.json"
      - "contracts/windows-production-host-generation-recovery-v1.json"
      - "contracts/windows-production-host-physical-reboot-v1.json"
      - "contracts/windows-production-host-reboot-admission-v1.json"
      - "contracts/windows-service-generation-recovery-v1.json"
      - "contracts/windows-capture-fragment-effect-v1.json"
      - "contracts/windows-packet-flow-v1.json"
      - "contracts/windows-packet-capture-v4.json"
      - "contracts/windows-userspace-byte-owner-v1.json"
      - "contracts/windows-userspace-flow-binding-v1.json"
      - "contracts/windows-userspace-native-connector-effect-v1.json"
      - "contracts/windows-userspace-stack-connector-composition-v1.json"
      - "contracts/windows-userspace-stack-effect-v1.json"
      - "contracts/windows-userspace-stack-ipv6-fragment-input-v1.json"
      - "contracts/windows-userspace-stack-selection-v1.json"
      - "contracts/windows-wintun-stack-handoff-v1.json"
      - "contracts/windows-wintun-ipv6-stack-handoff-v1.json"
      - "contracts/windows-wintun-tcp-stack-handoff-v1.json"
      - "contracts/windows-route-change-observer-v1.json"
      - "crates/slipstream-core/**"
      - "crates/slipstream-userspace-stack-evaluation/**"
      - "crates/slipstream-userspace-stack-effect-evaluation/**"
      - "crates/slipstream-windows-adapter/**"
      - "scripts/run_bounded_windows_cargo_test.ps1"
      - "scripts/qualify_windows_production_host_reboot.ps1"
      - "vendor/wintun/**"
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: windows-packet-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-wintun-lifecycle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: amd64
            source_architecture: x86_64
            os_architecture: X64
          - runner: windows-11-arm
            architecture: arm64
            source_architecture: aarch64
            os_architecture: Arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable-2026-06-30
        with:
          components: clippy

      - name: Require the expected native runner architecture
        shell: pwsh
        env:
          EXPECTED_OS_ARCHITECTURE: ${{ matrix.os_architecture }}
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $env:EXPECTED_OS_ARCHITECTURE) {
            throw "Expected $($env:EXPECTED_OS_ARCHITECTURE), got $actual"
          }

      - name: Build the production host and disposable Windows service fixtures
        run: cargo build --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture --bins

      - name: Parse physical reboot qualification harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $script = Resolve-Path "scripts/qualify_windows_production_host_reboot.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script.Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Physical reboot qualification harness has parser errors"
          }

      - name: Qualify same-name Windows service-generation recovery
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_SERVICE_GENERATION_RECOVERY_CI: "1"
        run: |
          $fixture = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-disposable-service.exe"
          $env:SLIPSTREAM_WINDOWS_SERVICE_FIXTURE = $fixture.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_native::windows::tests::native_service_generation_recovery_replaces_owned_payload_after_exact_absence -- --exact --test-threads=1

      - name: Qualify real production-host generation replacement
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_PRODUCTION_HOST_GENERATION_RECOVERY_CI: "1"
        run: |
          $serviceHost = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-windows-service.exe"
          $env:SLIPSTREAM_WINDOWS_PRODUCTION_HOST = $serviceHost.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_host::windows::tests::production_host_generation_recovery_uses_exact_cli_uninstall -- --exact --test-threads=1

      - name: Qualify real production-host exact crash recovery
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_PRODUCTION_HOST_CRASH_RECOVERY_CI: "1"
        run: |
          $serviceHost = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-windows-service.exe"
          $env:SLIPSTREAM_WINDOWS_PRODUCTION_HOST = $serviceHost.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_host::windows::tests::production_host_crash_recovery_uses_exact_verified_process -- --exact --test-threads=1

      - name: Qualify production-host reboot admission
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_PRODUCTION_HOST_REBOOT_ADMISSION_CI: "1"
        run: |
          $serviceHost = Resolve-Path "crates/slipstream-windows-adapter/target/debug/slipstream-windows-service.exe"
          $env:SLIPSTREAM_WINDOWS_PRODUCTION_HOST = $serviceHost.Path
          cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-service-fixture service_host::windows::tests::production_host_reboot_admission_requires_exact_automatic_start_configuration -- --exact --test-threads=1

      - name: Qualify frozen packet-flow ownership on the native architecture
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test packet_flow_contract -- --test-threads=1

      - name: Qualify selected-stack and native-connector composition on the native architecture
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml -- --test-threads=1

      - name: Qualify read-only route and source observation
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $testName = "native_packet_route_observer_is_read_only_and_consistent"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --test packet_egress_windows $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact read-only route observer test did not execute"
          }

      - name: Qualify sealed owned-route transition issuer
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
        run: |
          $testFilter = "packet_egress::transition_v1::tests"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --lib $testFilter -- --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          $executed = @($lines | Where-Object { $_ -match '^test packet_egress::transition_v1::tests::.+ \.\.\. ok$' })
          if ($executed.Count -eq 0) {
            throw "Expected sealed owned-route transition tests did not execute"
          }

      - name: Fetch and verify the pinned Wintun package
        shell: pwsh
        env:
          SOURCE_ARCHITECTURE: ${{ matrix.source_architecture }}
        run: |
          $source = Get-Content -Raw "vendor/wintun/SOURCE.json" | ConvertFrom-Json
          $expectedUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          if ($source.version -ne "0.14.1" -or $source.source_url -ne $expectedUrl) {
            throw "Wintun source record is not the reviewed 0.14.1 package"
          }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP "slipstream-wintun-$($source.version)"
          $archive = Join-Path $fixtureRoot "wintun-$($source.version).zip"
          $expanded = Join-Path $fixtureRoot "expanded"
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null

          $verified = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            try {
              Invoke-WebRequest -Uri $source.source_url -OutFile $archive
              $archiveFile = Get-Item -LiteralPath $archive
              $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($archiveFile.Length -eq [long]$source.archive_length -and $archiveHash -eq $source.archive_sha256) {
                $verified = $true
                break
              }
              Write-Warning "Wintun attempt $attempt returned an incomplete or mismatched archive"
            } catch {
              Write-Warning "Wintun attempt $attempt failed: $($_.Exception.Message)"
            }
            if ($attempt -lt 4) {
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          if (-not $verified) {
            throw "Pinned Wintun archive did not pass exact length and SHA-256 after four attempts"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $architecture = $source.architectures.PSObject.Properties[$env:SOURCE_ARCHITECTURE].Value
          if ($null -eq $architecture) {
            throw "Missing Wintun source record for $($env:SOURCE_ARCHITECTURE)"
          }
          $dll = Join-Path $expanded $architecture.path
          $dllFile = Get-Item -LiteralPath $dll
          $dllHash = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dllFile.Length -ne [long]$architecture.length -or $dllHash -ne $architecture.sha256) {
            throw "Pinned Wintun DLL did not pass exact length and SHA-256"
          }

          "SLIPSTREAM_WINTUN_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SLIPSTREAM_WINTUN_LICENSE=$(Join-Path $expanded $source.license.path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SLIPSTREAM_WINTUN_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Qualify owned adapter and session cleanup
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_LIFECYCLE_CI: "1"
        run: |
          $testName = "native_wintun_adapter_and_session_lifecycle_is_owned_and_disposable"
          $output = & cargo test --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --features disposable-windows-packet-fixture --test wintun_lifecycle_windows $testName -- --exact --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | Write-Output
          if ($exitCode -ne 0) {
            exit $exitCode
          }
          if ($lines -notcontains "test $testName ... ok") {
            throw "Expected exact native Wintun lifecycle test did not execute"
          }

      - name: Qualify exact child-process termination cleanup
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_CRASH_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_lifecycle_windows `
            -TestName native_wintun_child_termination_removes_owned_adapter_and_session `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify exact-route transition, pinned egress revalidation, and cleanup
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_exact_route_transition_is_owned_and_removed `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify crash-safe active capture removal
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_CRASH_REMOVAL_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_child_termination_removes_active_capture_route `
            -TimeoutSeconds 180 `
            -NoCapture

      - name: Qualify same-name Wintun capture-generation recovery
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_CAPTURE_GENERATION_RECOVERY_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_same_name_capture_generation_recovers_without_stale_state `
            -TimeoutSeconds 180 `
            -NoCapture

      - name: Qualify independent VPN-like route-owner coexistence
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_INDEPENDENT_ROUTE_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_independent_route_owner_is_preserved_during_capture `
            -TimeoutSeconds 180 `
            -NoCapture

      - name: Qualify native route-churn invalidation and exact cleanup
        timeout-minutes: 4
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_ROUTE_CHURN_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_route_churn_invalidates_activation_and_cleans_exactly `
            -TimeoutSeconds 180 `
            -NoCapture

      - name: Qualify no-payload IPv4 socket selection under exact route
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv4_socket_binding_avoids_the_competing_exact_route `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify no-payload IPv6 socket selection under exact route
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv6_socket_binding_avoids_the_competing_exact_route `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify Wintun-to-selected-stack IPv4 UDP handoff
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PACKET_DELIVERY_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv4_udp_round_trip_crosses_the_selected_stack `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify Wintun-to-selected-stack IPv6 UDP handoff
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PACKET_DELIVERY_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv6_udp_round_trip_crosses_the_selected_stack `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify Wintun-to-selected-stack IPv4 TCP handoff
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PACKET_DELIVERY_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv4_tcp_round_trip_crosses_the_selected_stack `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify pre-existing IPv4 UDP flow activation safety
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PACKET_DELIVERY_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PREEXISTING_FLOW_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv4_preexisting_flow_is_preserved_or_safely_recovered `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Qualify pre-existing IPv4 TCP flow activation safety
        timeout-minutes: 3
        shell: pwsh
        env:
          CARGO_TERM_COLOR: never
          SLIPSTREAM_WINDOWS_DISPOSABLE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_EXACT_ROUTE_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_SOCKET_BINDING_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PACKET_DELIVERY_CI: "1"
          SLIPSTREAM_WINDOWS_WINTUN_PREEXISTING_TCP_FLOW_CI: "1"
        run: |
          ./scripts/run_bounded_windows_cargo_test.ps1 `
            -ManifestPath crates/slipstream-windows-adapter/Cargo.toml `
            -Features disposable-windows-packet-fixture `
            -TestTarget wintun_exact_route_windows `
            -TestName native_wintun_ipv4_tcp_preexisting_flow_is_preserved_or_safely_recovered `
            -TimeoutSeconds 120 `
            -NoCapture

      - name: Lint the disposable packet fixture
        run: cargo clippy --locked --manifest-path crates/slipstream-windows-adapter/Cargo.toml --all-targets --features disposable-windows-packet-fixture -- -D warnings

      - name: Lint selected-stack and native-connector composition
        run: cargo clippy --locked --manifest-path crates/slipstream-userspace-stack-effect-evaluation/Cargo.toml --all-targets -- -D warnings

      - name: Qualify the exact physical reboot production host before packaging
        shell: pwsh
        env:
          QUALIFICATION_GENERATION: ${{ github.run_id }}
        run: |
          cargo build --locked `
            --manifest-path crates/slipstream-windows-adapter/Cargo.toml `
            --release `
            --bin slipstream-windows-service
          if ($LASTEXITCODE -ne 0) {
            throw "The release production host build failed."
          }
          $script = (Resolve-Path "scripts/qualify_windows_production_host_reboot.ps1").Path
          $hostPath = (Resolve-Path "crates/slipstream-windows-adapter/target/release/slipstream-windows-service.exe").Path
          $stateRoot = Join-Path $env:RUNNER_TEMP "slipstream-physical-reboot-preflight"
          $prepared = $false
          try {
            & $script `
              -Phase prepare `
              -ServiceHost $hostPath `
              -Generation ([long]$env:QUALIFICATION_GENERATION) `
              -StateRoot $stateRoot
            $prepared = $true
            & $script -Phase cleanup -StateRoot $stateRoot
            $prepared = $false
            $result = Get-Content -LiteralPath (Join-Path $stateRoot "result-v1.json") -Raw |
              ConvertFrom-Json
            if ($result.outcome -ne "cleanup_only" -or -not $result.exact_uninstall_verified) {
              throw "The exact release production host did not prove pre-reboot cleanup."
            }
          } finally {
            if ($prepared) {
              & $script -Phase cleanup -StateRoot $stateRoot
            }
          }

      - name: Package the exact physical reboot qualification bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          BUNDLE_ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "slipstream-windows-physical-reboot-$env:BUNDLE_ARCHITECTURE"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          $sources = [ordered]@{
            "slipstream-windows-service.exe" = "crates/slipstream-windows-adapter/target/release/slipstream-windows-service.exe"
            "qualify_windows_production_host_reboot.ps1" = "scripts/qualify_windows_production_host_reboot.ps1"
            "windows-production-host-physical-reboot-v1.json" = "contracts/windows-production-host-physical-reboot-v1.json"
          }
          $files = [ordered]@{}
          foreach ($entry in $sources.GetEnumerator()) {
            $source = (Resolve-Path -LiteralPath $entry.Value).Path
            $destination = Join-Path $bundle $entry.Key
            Copy-Item -LiteralPath $source -Destination $destination
            $files[$entry.Key] = [ordered]@{
              sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              size = (Get-Item -LiteralPath $destination).Length
            }
          }
          $manifest = [ordered]@{
            schema_version = 1
            artifact = "slipstream.windows_physical_reboot_qualification"
            source_commit = $env:SOURCE_COMMIT
            architecture = $env:BUNDLE_ARCHITECTURE
            workflow_run_id = [long]$env:WORKFLOW_RUN_ID
            files = $files
          }
          $manifestPath = Join-Path $bundle "artifact-manifest-v1.json"
          $json = $manifest | ConvertTo-Json -Depth 6 -Compress
          [IO.File]::WriteAllText($manifestPath, $json, [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $manifestPath -Raw

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: slipstream-windows-physical-reboot-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/slipstream-windows-physical-reboot-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
