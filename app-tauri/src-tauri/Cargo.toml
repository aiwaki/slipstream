[package]
name = "slipstream"
version = "0.1.9-preview.23"
description = "Slipstream — local DPI-bypass tray"
authors = ["Slipstream"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "slipstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slipstream"
path = "src/main.rs"

[[bin]]
name = "slipstream-browser-probe"
path = "src/bin/slipstream-browser-probe.rs"

[[bin]]
name = "slipstream-update-watchdog"
path = "src/bin/slipstream-update-watchdog.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"        # sidecar: bundled geph5-client
tauri-plugin-updater = "=2.9.0" # exact-pinned for reproducible signed updater builds
tauri-plugin-single-instance = "2"   # one tray icon, not three
tauri-plugin-autostart = "2"    # real Launch-at-Login (LoginItem)
tauri-plugin-notification = "2" # geph up/down + update toasts
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# Keep security-sensitive updater dependencies exact-pinned so release
# candidates cannot silently change archive or signature handling.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
notify-rust = "=4.12.0"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
plist = "=1.10.0"
minisign-verify = "=0.2.5"
sha2 = "0.10"
signal-hook = "0.3"
libc = "0.2"
slipstream-core = { path = "../../crates/slipstream-core" }
tokio = { version = "1", features = ["time", "net", "io-util", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# notify-rust permits any 0.6.x release; newer mac-notification-sys releases
# raised MSRV above Slipstream's declared floor.
mac-notification-sys = "=0.6.9"
block2 = "=0.6.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["block2", "UNNotificationSettings", "UNUserNotificationCenter"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
